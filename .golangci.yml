version: "2"

run:
  timeout: 3m
  build-tags:
    - go_tarantool_ssl_disable
    - tt_ssl_disable
    - integration
    - integration_docker
    - mage

formatters:
  enable:
    - goimports

issues:
  # Disable limits on the number of printed issues
  max-issues-per-linter: 0 # 0 = no limit
  max-same-issues: 0 # 0 = no limit

linters:
  default: all

  disable:
    - arangolint
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - gomodguard_v2
    - gosec
    - gosmopolitan
    - govet
    - iface
    - importas
    - inamedparam
    - intrange
    - ireturn
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - promlinter
    - protogetter
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - tagalign
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
    - wsl_v5
    - zerologlint

  settings:
    varnamelen:
      ignore-names:
        - tt
        - ok
        - tb
      ignore-decls:
        - t T
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true

    tagliatelle:
      case:
        rules:
          # tt's machine-readable payloads are snake_case, matching the manifest
          # and lock files they are derived from.
          json: snake
          yaml: snake

    exhaustive:
      # A switch with a default clause is treated as exhaustive.
      default-signifies-exhaustive: true
    godot:
      scope: all
    lll:
      line-length: 100
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0
      default: all
    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            # cli/manifest/version derives SemVer with go-version so its
            # pre-release ordering matches the dependency resolver.
            - "github.com/hashicorp/go-version"
            - "github.com/tarantool/go-luarocks"
            # cli/manifest/resolve composes the model and the luarocks adapter
            # into the dependency-resolution engine.
            - "github.com/tarantool/tt/cli/manifest"
            # cli/manifest/build/backend runs subprocesses through tt's shared
            # helper rather than reinventing exec plumbing.
            - "github.com/tarantool/tt/cli/util"
            # cli/manifest/build filters component files with gitignore-syntax
            # include/exclude patterns via go-git's matcher.
            - "github.com/go-git/go-git/v5/plumbing/format/gitignore"
            # cli/manifest/pack compresses the .tt archive as tar+zstd.
            - "github.com/klauspost/compress/zstd"
            # cli/manifest/pack drives the build before archiving its result.
            - "github.com/tarantool/tt/cli/manifest/build"
            # cli/manifest/install refetches dependencies through the luarocks
            # adapter and reuses the build package's exit-code machinery.
            - "github.com/tarantool/tt/cli/manifest/rocks"
            # cli/manifest/install and cli/manifest/inventory both read and write
            # the on-disk install state that cli/manifest/state owns.
            #
            # NOTE: depguard matches the longest prefix, not any prefix. Listing a
            # sub-package here shadows the broader "…/cli/manifest" entry for its
            # siblings, so an entry added for one package can start flagging
            # imports that used to pass. Add sub-packages only where the broader
            # entry is already shadowed, as it is in this list.
            - "github.com/tarantool/tt/cli/manifest/state"
            # cli/manifest/build and cli/manifest/deps drive the dependency
            # resolver; deps also names resolve.Pins in its own signatures.
            - "github.com/tarantool/tt/cli/manifest/resolve"
            # cli/manifest/inventory renders tt package list as YAML, the
            # machine-readable default for non-TTY output.
            - "gopkg.in/yaml.v3"
        test:
          files:
            - "$test"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            - "github.com/hashicorp/go-version"
            - "github.com/stretchr/testify"
            # Covers every cli/manifest sub-package a test may import, including
            # the rocks adapter the resolve engine fakes and the resolve package
            # deps names in its own signatures. Do NOT list those sub-packages
            # individually here: per the NOTE on the main list, depguard matches
            # the longest prefix, so a sub-package entry shadows this one for its
            # siblings and starts flagging imports that used to pass. Adding two
            # such entries cost 14 spurious findings across inventory, install,
            # state and version tests before this was understood.
            - "github.com/tarantool/tt/cli/manifest"
            - "github.com/tarantool/go-luarocks"
            # cli/manifest/pack tests decompress the archive they just wrote.
            - "github.com/klauspost/compress/zstd"
            # cli/manifest/inventory tests round-trip the YAML they rendered.
            - "gopkg.in/yaml.v3"
