        dir-sdk-scope:
          files:
            - "**/sdk/scope/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/v3/scope"
        # The parser of instance descriptions takes bytes and reads nothing
        # itself: a leaf under the commands, the supervisor's peer.
        dir-internal-instances:
          files:
            - "**/internal/instances/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/v3/internal/instances"
            - "go.yaml.in/yaml/v3"
        # The process supervisor sits under the commands that run it and
        # depends on none of them. x/sys/unix asks macOS how a child handles
        # a signal.
        dir-internal-supervisor:
          files:
            - "**/internal/supervisor/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "golang.org/x/sys/unix"
            - "github.com/tarantool/tt/v3/internal/pidfile"
            - "github.com/tarantool/tt/v3/internal/supervisor"
        # The systemd units of an application and the mark of what they
        # manage: a leaf, which takes what the units are made of and knows
        # nothing of how tt finds an application or runs an instance.
        dir-internal-systemd:
          files:
            - "**/internal/systemd/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/v3/internal/instances"
            - "github.com/tarantool/tt/v3/internal/systemd"
            - "go.yaml.in/yaml/v3"
