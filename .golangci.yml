version: "2"

run:
  # A run over the root module takes seconds with its caches and a minute on
  # a CI runner without that of golangci-lint. Without the Go build cache, as
  # the first run on a runner after a change of go.sum is, loading the
  # packages alone took more than 3 minutes there. The timeout is only
  # against a hang.
  timeout: 10m
  build-tags:
    - integration
    - integration_docker
    - mage

formatters:
  enable:
    - goimports

issues:
  # Disable limits on the number of printed issues
  max-issues-per-linter: 0 # 0 = no limit
  max-same-issues: 0 # 0 = no limit

linters:
  default: all

  disable:
    - cyclop # Cyclop is disabled, since cyclomatic complexity is a very abstract metric
      # that sometimes leads to strange linter behavior.
    - dupl # Dupl is disabled, since we're generating a lot of boilerplate code.
    - exhaustruct # Deprecated since golangci-lint v2.13.0; exhaustruct_v5 is enabled instead.
    - funlen # Funlen is disabled, function length limits are too restrictive.
    - gochecknoglobals # Gochecknoglobals is disabled until cli/cmd is refactored.
      # Re-enable it after the refactoring.
    - gocognit # Gocognit is disabled, cognitive complexity is too restrictive.
    - godox # Godox is disabled to allow TODO comments for unimplemented functionality.
    - gomodguard # Deprecated since golangci-lint v2.12.0; gomodguard_v2 is enabled instead.
    - ireturn # Ireturn is disabled, since it's not needed.
    - maintidx # Maintidx is disabled, purpose of this metric is unknown.
    - nlreturn # Nlreturn is disabled, since it's duplicated by wsl_v5.return check.
    - paralleltest # Paralleltest is disabled because some tests use shared process-wide state.
    - tparallel # Tests intentionally run serially because they share process-wide state.
    - wsl # Deprecated since golangci-lint v2.2.0; wsl_v5 is enabled instead.

  exclusions:
    generated: lax
    rules:
      # Manifest fixtures deliberately construct partial model values; keep the
      # stricter exhaustruct variant enabled everywhere else.
      - path: (^|/)cli/manifest/
        linters:
          - exhaustruct_v5
      # The project directory is selected by the caller and the lock-file name
      # is constant, so writing the lock next to the manifest is intentional.
      - path: ^cli/manifest/deps/deps\.go$
        text: "G703: Path traversal via taint analysis"
        linters:
          - gosec
      # Keep the existing source-level suppression compatible with nolintlint
      # without changing manifest code.
      - path: ^cli/manifest/deps/deps\.go$
        text: 'directive `//nolint:gosec'
        linters:
          - nolintlint
      # Keep established compact error checks while applying every other WSL
      # rule, including future findings in these files.
      - path: ^cli/manifest/(install/reconcile_internal_test|manifest|resolve/resolve|version/version_test)\.go$
        source: '^\s*(var exit \*ExitError|var strict \*toml\.StrictMissingError|var conflict \*pinConflictError|t\.Helper\(\))$'
        linters:
          - wsl_v5
      # tt is a CLI: it opens the paths its user and its config name (G304)
      # and runs tarantool, git and build tools with arguments built at run
      # time (G204). Both are the job, not an injection.
      - linters:
          - gosec
        text: "^G(204|304):"
      # The sdk/log printf functions log through the process logger and take
      # no context, so a caller holding one has nothing to pass them.
      - linters:
          - contextcheck
        text: 'Function `(\w+->)*(Debug|Info|Warn|Error)f?->emit` should pass the context parameter'
      # Tests create their fixtures under t.TempDir() with whatever mode the
      # scenario needs, at paths from t.TempDir(), testdata and variables the
      # test sets itself: there is no untrusted input to taint (G703).
      - path: _test.go
        linters:
          - gosec
        text: "^G(301|302|306|703):"
      - path: _test.go
        linters:
          - wrapcheck
          - err113
          - funlen
          # Test fixtures intentionally repeat representative values.
          - goconst
          # Table-driven and fixture tests build partial structs on purpose;
          # requiring every field spelled out is noise in tests.
          - exhaustruct_v5
      # recvcheck accepts Constraint's mixed value and pointer receivers, so
      # its existing compatibility directive is intentionally retained.
      - path: ^cli/manifest/constraint\.go$
        text: 'directive `//nolint:recvcheck'
        linters:
          - nolintlint
      # The resolver deliberately adds dependency context above its cache
      # boundary; keep its existing wrapcheck suppressions without touching
      # manifest code.
      - path: ^cli/manifest/resolve/cache\.go$
        text: 'directive `//nolint:wrapcheck'
        linters:
          - nolintlint
      # This repeated word is intentional YAML test data, not prose.
      - path: ^cli/connect/language_test\.go$
        text: Duplicate words \(true\) found
        linters:
          - dupword
      # The help of tt data play describes its row mode as "row     row by
      # row": the name of the mode, then what it does.
      - path: ^cli/cmd/data\.go$
        text: Duplicate words \(row\) found
        linters:
          - dupword
      # This key is part of the public module manifest format.
      - path: ^core/internal/extmod/modules\.go$
        text: 'yaml\(snake\): got ''tt-version'''
        linters:
          - tagliatelle
      # The build of a distribution reads the JSON the go command prints,
      # whose fields are named the Go way, and so does mage of the events of
      # go test -json.
      - path: ^(cli/manifest/distbuild/|magefile\.testjson\.go$)
        text: 'json\(snake\)'
        linters:
          - tagliatelle
      # Mage configures its process environment before any target runs.
      - path: ^magefile\.go$
        text: don't use `init` function
        linters:
          - gochecknoinits
      # Mage takes a target's exit status from its error by a type assertion,
      # not errors.As, so wrapping a failed command's error turns every exit
      # status into 1; the error already names the command it ran.
      - path: ^magefile(\.\w+)?\.go$
        text: 'sig: func github\.com/magefile/mage/sh\.'
        linters:
          - wrapcheck
      # The magefile works on the checkout and on the paths its user sets in
      # the environment: there is no untrusted input to taint (G703).
      - path: ^magefile(\.\w+)?\.go$
        text: "^G703:"
        linters:
          - gosec
      # Protobuf null is represented by an untyped nil value.
      - path: ^modules/aeon/internal/client/decode\.go$
        source: ^\s*return nil, nil$
        linters:
          - nilnil
      # Request push messages use box.session.push(); NewWatcher handles the
      # different box.broadcast protocol and is not a drop-in replacement.
      - path: ^cli/connector/binary\.go$
        source: \bfuture\.GetIterator\(\)
        linters:
          - staticcheck
      # etcd still uses grpc.DialContext and documents WithBlock for waiting
      # until the connection is ready within DialTimeout.
      - path: ^sdk/cluster/storage\.go$
        source: \bgrpc\.WithBlock\(\)
        linters:
          - staticcheck

  settings:
    wrapcheck:
      # Errors returned by tt packages are already contextualized at the
      # external boundary. Wrapping them again at every internal package
      # boundary only duplicates context in user-facing messages.
      ignore-package-globs:
        - github.com/tarantool/tt/*
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/c-bata/go-prompt
    varnamelen:
      ignore-names:
        - tt
        - ok
        - tb
      ignore-decls:
        - t T
        # The Context of a build, which every method of a build backend
        # takes (sdk/build).
        - c *build.Context
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true

    tagliatelle:
      case:
        rules:
          # tt's machine-readable payloads are snake_case, matching the manifest
          # and lock files they are derived from.
          json: snake
          yaml: snake

    exhaustruct_v5:
      # The check is for tt's own types: a new field has to reach every
      # literal that builds one. Library and standard types (cobra.Command,
      # tls.Config, ...) are configured by naming the fields that matter.
      explicit-mode: true
      enforce-patterns:
        - 'github\.com/tarantool/tt/.+'
      # Generated protobuf messages carry internal state fields.
      ignore-patterns:
        - 'github\.com/tarantool/tt/modules/aeon/pb\..+'
    exhaustive:
      # A switch with a default clause is treated as exhaustive.
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 30
    godot:
      scope: all
    lll:
      line-length: 100
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0
      default: all

    depguard:
      rules:
        # The core is built on top of the commands: nothing under cli/ but
        # tt's main package may import it. Like every issue, this one is
        # reported only for the packages the exclusion rules above keep in
        # scope; the core's TestCLIDoesNotImportCore checks the whole of cli/.
        core-boundary:
          files:
            - "**/cli/**"
            - "!**/cli/main.go"
          deny:
            - pkg: "github.com/tarantool/tt/v3/core"
              desc: the core imports cli/, never the other way round
        # Nothing but tests and test helpers may depend on testify.
        testify-in-tests:
          files:
            - "$all"
            - "!$test"
            - "!**/cli/cmd/helpgolden/**"
            - "!**/sdk/sdktest/**"
          deny:
            - pkg: "github.com/stretchr/testify"
              desc: testify belongs to tests and test helpers
        # Libraries tt has moved away from; keep them from coming back.
        legacy:
          deny:
            - pkg: "github.com/apex/log"
              desc: log through log/slog and the handler from sdk/log
            - pkg: "github.com/pkg/errors"
              desc: use errors and fmt.Errorf with %w from the standard library
            - pkg: "io/ioutil"
              desc: deprecated; use the io and os equivalents
            - pkg: "gopkg.in/yaml.v2"
              desc: use go.yaml.in/yaml/v3, or sdk/formatter for the YAML of a console
            - pkg: "gopkg.in/yaml.v3"
              desc: archived; use go.yaml.in/yaml/v3
        # YAML is go.yaml.in/yaml/v3. The console prints with
        # go.yaml.in/yaml/v2, which folds long lines as tt always did, through
        # sdk/formatter.EncodeYAML alone.
        yaml-v2:
          files:
            - "$all"
            - "!**/sdk/formatter/yaml.go"
          deny:
            - pkg: "go.yaml.in/yaml/v2"
              desc: encode the YAML of a console with sdk/formatter.EncodeYAML
        manifest:
          files:
            - "**/cli/manifest/**"
            - "!$test"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            # cli/manifest/version derives SemVer with go-version so its
            # pre-release ordering matches the dependency resolver.
            - "github.com/hashicorp/go-version"
            - "github.com/tarantool/go-luarocks"
            # Covers every cli/manifest sub-package one of its siblings imports:
            # resolve composes the model and the luarocks adapter, pack drives
            # build, install goes through rocks and shares state with
            # inventory, build derives versions through version.
            #
            # NOTE: depguard compares an import only with the entry sorted right
            # before it, so a sub-package listed here would shadow this entry
            # for every sibling sorted after it. Never list them one by one.
            - "github.com/tarantool/tt/v3/cli/manifest"
            # cli/manifest/build runs the commands of the build backends
            # through tt's shared helper rather than reinventing exec plumbing.
            - "github.com/tarantool/tt/v3/cli/util"
            # cli/manifest/build filters component files with gitignore-syntax
            # include/exclude patterns via go-git's matcher; cli/manifest/distbuild
            # reads the .gitignore files of the local modules it hashes with it.
            - "github.com/go-git/go-git/v5/plumbing/format/gitignore"
            # cli/manifest/pack compresses the .tt archive as tar+zstd.
            - "github.com/klauspost/compress/zstd"
            # cli/manifest/deps, install and registry carry their exit codes
            # in the SDK's ExitError; build, pack, install and distbuild write
            # the programs they lay out with no fork in between
            # (sdk/execfile).
            - "github.com/tarantool/tt/sdk/v3"
            # cli/manifest/pack checks the instance descriptions of the
            # templates it packs with the parser tt instance reads them with,
            # and against the topology of their configs as tt instance does.
            - "github.com/tarantool/tt/v3/internal/instances"
            - "github.com/tarantool/tt/v3/cli/app"
            # cli/manifest/state lays applications of the user and system
            # scopes out next to the products of tt binary: the scope roots,
            # the versions/ naming and the link replacement are theirs, and a
            # running instance is told by its pid file.
            - "github.com/tarantool/tt/v3/internal/binary"
            # cli/manifest/distbuild builds a distribution of tt with the
            # build tags and linker flags the magefile builds tt with.
            - "github.com/tarantool/tt/v3/internal/buildflags"
            - "github.com/tarantool/tt/v3/internal/pidfile"
            # cli/manifest/rocks sets the CMake policy version for the rocks
            # it builds, which build and run keep from the user's code.
            - "github.com/tarantool/tt/v3/internal/cmakepolicy"
            - "github.com/tarantool/tt/v3/cli/version"
            # cli/manifest/run starts the tarantool the instance commands
            # start, chosen by the one resolver.
            - "github.com/tarantool/tt/v3/cli/tarantool"
            - "github.com/tarantool/tt/sdk/build/v3"
            - "github.com/tarantool/tt/sdk/integrity/v3"
        manifest-test:
          files:
            - "**/cli/manifest/**/*_test.go"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            - "github.com/hashicorp/go-version"
            - "github.com/stretchr/testify"
            # Covers every cli/manifest sub-package a test may import, including
            # the rocks adapter the resolve engine fakes and the resolve package
            # deps names in its own signatures. Do NOT list those sub-packages
            # individually here: per the NOTE on the main list, depguard matches
            # the longest prefix, so a sub-package entry shadows this one for its
            # siblings and starts flagging imports that used to pass. Adding two
            # such entries cost 14 spurious findings across inventory, install,
            # state and version tests before this was understood.
            - "github.com/tarantool/tt/v3/cli/manifest"
            - "github.com/tarantool/go-luarocks"
            # cli/manifest/pack tests decompress the archive they just wrote.
            - "github.com/klauspost/compress/zstd"
            # deps, inventory and registry tests round-trip the YAML they
            # rendered.
            - "go.yaml.in/yaml/v3"
            # Tests render results through a Printer with the core's formats,
            # the way the commands do.
            - "github.com/tarantool/tt/v3/cli/printing"
            # Tests check the exit code an error carries (the SDK's ExitError)
            # and the one tt exits with for it (cli/exitcode).
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/v3/cli/exitcode"
            # cli/manifest/pack tests match the parser's error for a broken
            # instance description, and the resolver's for one that does not
            # fit its topology.
            - "github.com/tarantool/tt/v3/internal/instances"
            - "github.com/tarantool/tt/v3/cli/app"
            # cli/manifest/install tests check that what install lays out is
            # what tt binary lists and what the tarantool resolver finds.
            - "github.com/tarantool/tt/v3/cli/tarantool"
            - "github.com/tarantool/tt/v3/internal/binary"
            # cli/manifest/build tests check that a component does not get the
            # CMake policy version of the rocks.
            - "github.com/tarantool/tt/v3/internal/cmakepolicy"
            - "github.com/tarantool/tt/sdk/build/v3"
            - "github.com/tarantool/tt/sdk/build/v3/buildtest"
            - "github.com/tarantool/tt/sdk/integrity/v3"
        # One allow-list per top-level directory, tests included; their file
        # globs do not overlap, so each file is checked against exactly one
        # of them (plus the deny-only rules above). An import from another
        # tt directory or a new third-party module needs an entry here: that
        # edit is the point where a new dependency gets reviewed. List a
        # module or a directory, never one of its sub-packages next to it.
        dir-root:
          files:
            - "**/magefile*.go"
          allow:
            - $gostd
            - "github.com/magefile/mage"
            # The build tags and linker flags of a tt binary, kept in one place.
            - "github.com/tarantool/tt/v3/internal/buildflags"
        dir-cli:
          files:
            - "**/cli/*.go"
          allow:
            - $gostd
            - "github.com/tarantool/tt/v3/core"
            # The standard modules tt is built with, listed once.
            - "github.com/tarantool/tt/v3/standard"
        # The standard modules of tt: the modules of its repository, and
        # nothing of the core, which the core's internal tests import it
        # into.
        dir-standard:
          files:
            - "**/standard/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/modules/aeon"
            - "github.com/tarantool/tt/modules/build"
            - "github.com/tarantool/tt/modules/emmylua"
            - "github.com/tarantool/tt/modules/wasm"
            - "github.com/tarantool/tt/v3/standard"
        # The build backends of tt, each a package of the module build, are
        # written against the contract of a build backend alone, as the
        # backend of any module is: the standard library and sdk/build only,
        # and testify for the tests.
        dir-modules-build-backends:
          files:
            - "**/modules/build/*/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/build/v3"
        # The root package of the module build gives its backends to tt
        # through the module contract.
        dir-modules-build:
          files:
            - "**/modules/build/*.go"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/modules/build"
            - "github.com/tarantool/tt/sdk/build/v3"
            - "github.com/tarantool/tt/sdk/v3"
        # The module wasm, tt wasm and the check of the .wasm files, is
        # written against the SDK alone, as any module is: nothing of the
        # core, its own packages, and the libraries it needs.
        dir-modules-wasm:
          files:
            - "**/modules/wasm/**"
          allow:
            - $gostd
            - "github.com/spf13/cobra"
            - "github.com/stretchr/testify"
            # The rocks of a release are packed and read as LuaRocks does.
            - "github.com/tarantool/go-luarocks"
            - "github.com/tarantool/tt/modules/wasm"
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/sdk/build/v3"
            - "github.com/tarantool/tt/sdk/fetch/v3"

        dir-internal-binary:
          files:
            - "**/internal/binary/**"
          allow:
            - $gostd
            - "github.com/fatih/color"
            - "github.com/hashicorp/go-version"
            - "github.com/manifoldco/promptui"
            - "github.com/mgutz/ansi"
            - "github.com/otiai10/copy"
            - "github.com/spf13/pflag"
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/v3/cli/cmdcontext"
            - "github.com/tarantool/tt/v3/cli/docker"
            - "github.com/tarantool/tt/v3/cli/exitcode"
            - "github.com/tarantool/tt/v3/cli/templates"
            - "github.com/tarantool/tt/v3/cli/version"
            - "github.com/tarantool/tt/v3/internal/binary"
            # A Tarantool built from source gets the CMake policy version.
            - "github.com/tarantool/tt/v3/internal/cmakepolicy"
            - "github.com/tarantool/tt/v3/internal/untar"
            - "github.com/ulikunitz/xz"
            - "golang.org/x/net/html"
            - "golang.org/x/sys"
            # The menus of tt binary switch are shown on a terminal only.
            - "golang.org/x/term"
            - "github.com/tarantool/tt/sdk/connect/v3"
            - "github.com/tarantool/tt/sdk/fetch/v3"
        dir-cli-backup:
          files:
            - "**/cli/backup/**"
          allow:
            - $gostd
            - "github.com/google/uuid"
            - "github.com/klauspost/compress/zstd"
            - "github.com/mitchellh/mapstructure"
            - "github.com/stretchr/testify"
            - "github.com/tarantool/go-iproto"
            - "github.com/tarantool/go-tarantool/v3"
            - "github.com/tarantool/go-xlog"
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/v3/cli/backup"
            - "github.com/tarantool/tt/v3/cli/connector"
            - "github.com/tarantool/tt/v3/cli/util"
            - "github.com/vmihailenco/msgpack/v5"
            - "go.yaml.in/yaml/v3"
            - "github.com/tarantool/tt/sdk/backup/v3/archive"
            - "github.com/tarantool/tt/sdk/backup/v3/storage"
            - "github.com/tarantool/tt/sdk/backup/v3/storage/fs"
            - "github.com/tarantool/tt/sdk/backup/v3/storage/s3"
        dir-cli-restore:
          files:
            - "**/cli/restore/**"
          allow:
            - $gostd
            - "github.com/google/uuid"
            - "github.com/klauspost/compress/zstd"
            - "github.com/stretchr/testify"
            - "github.com/tarantool/go-iproto"
            - "github.com/tarantool/go-xlog"
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/v3/cli/backup"
            - "github.com/tarantool/tt/v3/cli/restore"
            - "github.com/tarantool/tt/v3/cli/util/regexputil"
            - "github.com/vmihailenco/msgpack/v5"
            - "github.com/tarantool/tt/sdk/backup/v3/archive"
            - "github.com/tarantool/tt/sdk/backup/v3/storage"
        dir-sdk-backup:
          files:
            - "**/sdk/backup/**"
          allow:
            - $gostd
            - "github.com/klauspost/compress"
            - "github.com/minio/minio-go/v7"
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/backup/v3"
            - "github.com/testcontainers/testcontainers-go"
        # The downloads of tt and its modules depend on the standard library
        # only, so that any module can take them in; testify is for the tests.
        dir-sdk-fetch:
          files:
            - "**/sdk/fetch/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/fetch/v3"
        # The contract of a build backend depends on the standard library
        # only, and not on the module contract, which depends on it;
        # testify is for the tests.
        dir-sdk-build:
          files:
            - "**/sdk/build/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/tt/sdk/build/v3"
        # The resolver of the application an instance command acts on: it
        # reads the manifest and loads the cluster config the way the rest
        # of tt does, and knows nothing of how instances are run.
        dir-cli-app:
          files:
            - "**/cli/app/**"
          allow:
            - $gostd
            - "github.com/stretchr/testify"
            - "github.com/tarantool/go-config/v2"
            # The integration test serves a thin config from an embedded etcd.
            - "github.com/tarantool/go-storage/v2"
            - "github.com/tarantool/tt/sdk/v3"
            - "github.com/tarantool/tt/v3/cli/app"
            - "github.com/tarantool/tt/v3/cli/cluster"
            - "github.com/tarantool/tt/v3/cli/manifest"
            - "github.com/tarantool/tt/v3/internal/instances"
            # "*" stands for the instances whose watchdog holds its pid file.
            - "github.com/tarantool/tt/v3/internal/pidfile"
            - "go.etcd.io/etcd/client/v3"
            - "github.com/tarantool/tt/sdk/connect/v3"
            - "github.com/tarantool/tt/sdk/integrity/v3"
        dir-cli-checkpoint:
          files:
            - "**/cli/checkpoint/**"
          allow:
            - $gostd
