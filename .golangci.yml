version: "2"

run:
  timeout: 3m
  build-tags:
    - go_tarantool_ssl_disable
    - tt_ssl_disable
    - integration
    - integration_docker
    - mage

formatters:
  enable:
    - goimports

issues:
  # Disable limits on the number of printed issues
  max-issues-per-linter: 0 # 0 = no limit
  max-same-issues: 0 # 0 = no limit

linters:
  default: all

  disable:
    - cyclop # Cyclop is disabled, since cyclomatic complexity is a very abstract metric
      # that sometimes leads to strange linter behavior.
    - dupl # Dupl is disabled, since we're generating a lot of boilerplate code.
    - exhaustruct # Deprecated since golangci-lint v2.13.0; exhaustruct_v5 is enabled instead.
    - funlen # Funlen is disabled, function length limits are too restrictive.
    - gochecknoglobals # Gochecknoglobals is disabled until cli/cmd is refactored.
      # Re-enable it after the refactoring.
    - gocognit # Gocognit is disabled, cognitive complexity is too restrictive.
    - godox # Godox is disabled to allow TODO comments for unimplemented functionality.
    - gomodguard # Deprecated since golangci-lint v2.12.0; gomodguard_v2 is enabled instead.
    - ireturn # Ireturn is disabled, since it's not needed.
    - maintidx # Maintidx is disabled, purpose of this metric is unknown.
    - nlreturn # Nlreturn is disabled, since it's duplicated by wsl_v5.return check.
    - paralleltest # Paralleltest is disabled because some tests use shared process-wide state.
    - tparallel # Tests intentionally run serially because they share process-wide state.
    - wsl # Deprecated since golangci-lint v2.2.0; wsl_v5 is enabled instead.

  exclusions:
    generated: lax
    rules:
      # Scope linting to the packages adopted into the strict ruleset. An issue
      # is excluded when its path is NOT one of them: either a file directly in
      # cli/manifest/, or anything under one of the named sub-packages. Add a
      # sub-package here once it lints clean; build, build/backend, inventory
      # and pack are the ones still outstanding.
      - path-except: (^|/)cli/manifest/((deps|install|resolve|rocks|state|version)/|[^/]+\.go$)
        text: ".*"
      # Manifest fixtures deliberately construct partial model values; keep the
      # stricter exhaustruct variant enabled everywhere else.
      - path: (^|/)cli/manifest/
        linters:
          - exhaustruct_v5
      # The project directory is selected by the caller and the lock-file name
      # is constant, so writing the lock next to the manifest is intentional.
      - path: ^cli/manifest/deps/deps\.go$
        text: "G703: Path traversal via taint analysis"
        linters:
          - gosec
      # Keep the existing source-level suppression compatible with nolintlint
      # without changing manifest code.
      - path: ^cli/manifest/deps/deps\.go$
        text: 'directive `//nolint:gosec'
        linters:
          - nolintlint
      # Keep established compact error checks while applying every other WSL
      # rule, including future findings in these files.
      - path: ^cli/manifest/(install/reconcile_internal_test|manifest|resolve/resolve|version/version_test)\.go$
        source: '^\s*(var exit \*ExitError|var strict \*toml\.StrictMissingError|var conflict \*pinConflictError|t\.Helper\(\))$'
        linters:
          - wsl_v5
      - path: _test.go
        linters:
          - wrapcheck
          - err113
          - funlen
          # Test fixtures intentionally repeat representative values.
          - goconst
          # Table-driven and fixture tests build partial structs on purpose;
          # requiring every field spelled out is noise in tests.
          - exhaustruct
      # recvcheck accepts Constraint's mixed value and pointer receivers, so
      # its existing compatibility directive is intentionally retained.
      - path: ^cli/manifest/constraint\.go$
        text: 'directive `//nolint:recvcheck'
        linters:
          - nolintlint
      # The resolver deliberately adds dependency context above its cache
      # boundary; keep its existing wrapcheck suppressions without touching
      # manifest code.
      - path: ^cli/manifest/resolve/cache\.go$
        text: 'directive `//nolint:wrapcheck'
        linters:
          - nolintlint
      # This repeated word is intentional YAML test data, not prose.
      - path: ^cli/connect/language_test\.go$
        text: Duplicate words \(true\) found
        linters:
          - dupword
      # This key is part of the public module manifest format.
      - path: ^cli/modules/modules\.go$
        text: 'yaml\(snake\): got ''tt-version'''
        linters:
          - tagliatelle
      # Mage configures its process environment before any target runs.
      - path: ^magefile\.go$
        text: don't use `init` function
        linters:
          - gochecknoinits
      # Protobuf null is represented by an untyped nil value.
      - path: ^cli/aeon/decode\.go$
        source: ^\s*return nil, nil$
        linters:
          - nilnil
      # Request push messages use box.session.push(); NewWatcher handles the
      # different box.broadcast protocol and is not a drop-in replacement.
      - path: ^cli/connector/binary\.go$
        source: \bfuture\.GetIterator\(\)
        linters:
          - staticcheck
      # etcd still uses grpc.DialContext and documents WithBlock for waiting
      # until the connection is ready within DialTimeout.
      - path: ^lib/cluster/storage\.go$
        source: \bgrpc\.WithBlock\(\)
        linters:
          - staticcheck

  settings:
    wrapcheck:
      # Errors returned by tt packages are already contextualized at the
      # external boundary. Wrapping them again at every internal package
      # boundary only duplicates context in user-facing messages.
      ignore-package-globs:
        - github.com/tarantool/tt/*
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        - github.com/c-bata/go-prompt
    varnamelen:
      ignore-names:
        - tt
        - ok
        - tb
      ignore-decls:
        - t T
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true

    tagliatelle:
      case:
        rules:
          # tt's machine-readable payloads are snake_case, matching the manifest
          # and lock files they are derived from.
          json: snake
          yaml: snake

    exhaustive:
      # A switch with a default clause is treated as exhaustive.
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 30
    godot:
      scope: all
    lll:
      line-length: 100
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0
      default: all

    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            # cli/manifest/version derives SemVer with go-version so its
            # pre-release ordering matches the dependency resolver.
            - "github.com/hashicorp/go-version"
            - "github.com/tarantool/go-luarocks"
            # cli/manifest/resolve composes the model and the luarocks adapter
            # into the dependency-resolution engine.
            - "github.com/tarantool/tt/cli/manifest"
            # cli/manifest/build/backend runs subprocesses through tt's shared
            # helper rather than reinventing exec plumbing.
            - "github.com/tarantool/tt/cli/util"
            # cli/manifest/build filters component files with gitignore-syntax
            # include/exclude patterns via go-git's matcher.
            - "github.com/go-git/go-git/v5/plumbing/format/gitignore"
            # cli/manifest/pack compresses the .tt archive as tar+zstd.
            - "github.com/klauspost/compress/zstd"
            # cli/manifest/pack drives the build before archiving its result.
            - "github.com/tarantool/tt/cli/manifest/build"
            # cli/manifest/install refetches dependencies through the luarocks
            # adapter and reuses the build package's exit-code machinery.
            - "github.com/tarantool/tt/cli/manifest/rocks"
            # cli/manifest/install and cli/manifest/inventory both read and write
            # the on-disk install state that cli/manifest/state owns.
            #
            # NOTE: depguard matches the longest prefix, not any prefix. Listing a
            # sub-package here shadows the broader "…/cli/manifest" entry for its
            # siblings, so an entry added for one package can start flagging
            # imports that used to pass. Add sub-packages only where the broader
            # entry is already shadowed, as it is in this list.
            - "github.com/tarantool/tt/cli/manifest/state"
            # cli/manifest/build and cli/manifest/deps drive the dependency
            # resolver; deps also names resolve.Pins in its own signatures.
            - "github.com/tarantool/tt/cli/manifest/resolve"
            # cli/manifest/inventory renders tt package list as YAML, the
            # machine-readable default for non-TTY output.
            - "gopkg.in/yaml.v3"
        test:
          files:
            - "$test"
          allow:
            - $gostd
            - "github.com/pelletier/go-toml/v2"
            - "github.com/hashicorp/go-version"
            - "github.com/stretchr/testify"
            # Covers every cli/manifest sub-package a test may import, including
            # the rocks adapter the resolve engine fakes and the resolve package
            # deps names in its own signatures. Do NOT list those sub-packages
            # individually here: per the NOTE on the main list, depguard matches
            # the longest prefix, so a sub-package entry shadows this one for its
            # siblings and starts flagging imports that used to pass. Adding two
            # such entries cost 14 spurious findings across inventory, install,
            # state and version tests before this was understood.
            - "github.com/tarantool/tt/cli/manifest"
            - "github.com/tarantool/go-luarocks"
            # cli/manifest/pack tests decompress the archive they just wrote.
            - "github.com/klauspost/compress/zstd"
            # cli/manifest/inventory tests round-trip the YAML they rendered.
            - "gopkg.in/yaml.v3"
