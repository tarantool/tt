# Generation of the Aeon gRPC bindings in ./pb; run ./generate-pb.sh, which
# also pins buf and the Go toolchain the plugins below are built with.
version: v2
inputs:
  - git_repo: https://github.com/tarantool/aeon-api-protos.git
    commit: 4df5e80c505da4ac0c80efaeac046fa32e0aa55a
# The schema declares no go_package. Managed mode would write one into the
# file descriptors embedded in the generated code, so the import path is given
# to the plugins with M options instead, one per .proto file.
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.0]
    out: pb
    opt: &go_opt
      - paths=source_relative
      - Maeon_crud.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_ddl.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_diag.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_error.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_schema.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_sql.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
      - Maeon_value.proto=github.com/tarantool/tt/v3/cli/aeon/pb;pb
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1]
    out: pb
    opt: *go_opt
clean: true
