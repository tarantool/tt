description: Vshard cluster template
follow-up-message: |
  What's next?
  Build and start '{{ .name }}' application:
      $ cd {{ .name }}
      $ tt package build
      $ tt instance start

  Pay attention that default passwords were generated,
  you can change it in .templates/default/config.yaml.

vars:
  - prompt: Bucket count
    name: bucket_count
    default: '3000'
    type: integer
    min: 1

  - prompt: Storage replication sets count
    name: replicasets_count
    default: '2'
    type: integer
    min: 1

  - prompt: Storage replicas per replication set count (>=2)
    name: replicas_count
    default: '2'
    type: integer
    min: 2

  - prompt: Routers count
    name: routers_count
    default: '1'
    type: integer
    min: 1
