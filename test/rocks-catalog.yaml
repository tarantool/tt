# The exceptions of the rocks catalogue check, and the system libraries the
# rocks build against.
#
# The check, test/integration/rocks_catalog, which .github/workflows/rocks.yml
# runs on a pull request labelled ci-rocks, takes every rock the manifest of
# rocks.tarantool.org lists, at the version tt package add resolves for it
# without a constraint: a rock new on the server is checked from the next run
# on. It builds the rock against the Tarantool of each level (project, user,
# system, os) and requires the modules the rock installed, on Ubuntu 24.04 and
# macOS, and on other Linux distributions in containers. An entry here naming
# a rock the server no longer has fails the check, and so does one that does
# not say why it is here.
#
# packages: what the workflow installs before the check: apt on Ubuntu and
# Debian, dnf on Rocky Linux and Fedora, pacman on Arch Linux, emerge on
# Gentoo (category/name, from its binary host) and brew on macOS; python3
# test/ci.py rocks-packages apt|brew|dnf|emerge|pacman prints the list. A
# package a distribution does not have is left out there (see
# ci/rocks-container.sh), and the rock that needs it fails there unless an
# entry skips it there.
#
# rocks: an entry per rock, of
#   skip: why the rock is not checked; with os or levels: [project, user,
#     system, os], it is not checked on those only. os takes linux, darwin
#     and the distributions of Linux by the ID of /etc/os-release, alone or
#     with the major number of its VERSION_ID: [gentoo, rocky-8] skips the
#     rock on Gentoo and on Rocky Linux 8;
#   constraint: the version constraint of tt package add NAME CONSTRAINT;
#   require: the modules to require, instead of those the check takes: the
#     Lua modules of the fewest dots the rock installed, or its C modules
#     when it has no Lua module;
#   exclude: the modules of those the check takes not to require;
#   reason: why the constraint, require or exclude is needed.

packages:
  apt:
    - libgeos-dev # gis
    - libgoogle-perftools-dev # gperftools: libprofiler.so
    - libmsgpuck-dev # cbench, shard
    - libpcre2-dev # lrexlib-pcre2
    - libpcre3-dev # lrexlib-pcre
    - libpq-dev # pg
    - libproj-dev # gis
    - librdkafka-dev # kafka, tnt-kafka
    - libsasl2-dev # memcached
    - libzookeeper-st-dev # zookeeper: libzookeeper_st
  brew:
    - cyrus-sasl # memcached
    - geos # gis
    - librdkafka # kafka, tnt-kafka
    - pcre # lrexlib-pcre
    - pcre2 # lrexlib-pcre2
    - proj # gis
    - zookeeper # zookeeper
  # EPEL and PowerTools or CRB on Rocky Linux. No repository has MsgPuck or
  # the C client of ZooKeeper; Fedora has no PCRE (1).
  dnf:
    - cyrus-sasl-devel # memcached
    - geos-devel # gis
    - gperftools-devel # gperftools
    - libpq-devel # pg
    - librdkafka-devel # kafka, tnt-kafka
    - pcre-devel # lrexlib-pcre
    - pcre2-devel # lrexlib-pcre2
    - proj-devel # gis
  # Arch Linux has neither MsgPuck nor the C client of ZooKeeper.
  pacman:
    - geos # gis
    - gperftools # gperftools
    - libsasl # memcached
    - librdkafka # kafka, tnt-kafka
    - pcre # lrexlib-pcre
    - pcre2 # lrexlib-pcre2
    - postgresql-libs # pg
    - proj # gis
  # The binary host of Gentoo has no librdkafka, and the tree has neither
  # MsgPuck nor the C client of ZooKeeper; the msgpuck 2.0 of the overlay of
  # Tarantool does not configure with CMake 4 (CMP0037 set to OLD).
  emerge:
    - dev-db/postgresql # pg: libpq
    - dev-libs/cyrus-sasl # memcached
    - dev-libs/libpcre # lrexlib-pcre
    - dev-libs/libpcre2 # lrexlib-pcre2
    - dev-util/google-perftools # gperftools
    - sci-libs/geos # gis
    - sci-libs/proj # gis

rocks:
  cartridge-metrics-role:
    require: []
    reason: >-
      a role of Cartridge, which the rock does not depend on: its modules
      load in an application of Cartridge only
  cbench:
    skip: Homebrew has no MsgPuck, which the rock builds against
    os: [darwin]
  gperftools:
    skip: >-
      loads libprofiler with ffi.load('profiler'), and Homebrew installs it
      into /opt/homebrew/lib, where the dynamic loader does not look (not
      tried yet)
    os: [darwin]
  http:
    exclude: [http.sslsocket]
    reason: >-
      http.sslsocket calls OpenSSL through ffi from the tarantool executable,
      which the static builds of Tarantool for Linux, of tt binary install and
      of the deb packages alike, do not export (undefined symbol
      TLS_server_method); http.server works without it
  icu-date:
    skip: >-
      calls ICU through ffi from the tarantool executable, which the static
      builds of Tarantool for Linux, of tt binary install and of the deb
      packages alike, do not export (undefined symbol ucnv_open)
    os: [linux]
  jsonpath:
    skip: >-
      depends on lulpeg, whose build requires the builtin compat module of
      Tarantool instead of its own (builtin/compat.lua: Invalid option lua52)
  lulpeg:
    skip: >-
      its build runs tarantool scripts/pack.lua, whose require 'compat' gets
      the builtin compat module of Tarantool instead of its own
      (builtin/compat.lua: Invalid option lua52)
  migrate:
    skip: >-
      scm-1 only: its builtin build includes <tarantool/module.h> and
      <msgpuck.h> from the default include path and links libsmall, which no
      system package has
  mqtt:
    skip: >-
      1.5.1-1 links the static libz.a of the system into driver.so, which
      fails ("relocation R_X86_64_PC32 ... recompile with -fPIC" on amd64)
    os: [linux]
  mrasender:
    skip: >-
      scm-1 only: uses struct luaL_reg, which the LuaJIT of Tarantool 3 does
      not have
  pg:
    skip: >-
      libpq of Homebrew is keg-only, and FindPostgreSQL of the rock does not
      look into its prefix (not tried yet)
    os: [darwin]
  shard:
    skip: Homebrew has no MsgPuck, which the rock builds against
    os: [darwin]
  sharded-queue:
    exclude: [sharded_queue.api]
    reason: >-
      sharded_queue.api is the API of the roles of Cartridge, which the rock
      does not depend on; the roles of Tarantool 3 load without it
