# metrics as a tt 3 package. The upstream rockspec builds with cmake, which
# installs the directory metrics/ twice: into LUADIR and into
# LUADIR/override/. Here that is two components of one directory.
manifest_version = "0.1"

[package]
name = "metrics"
description = "A centralized system for collecting and manipulating metrics from multiple clients"
license = "BSD"
license_files = ["LICENSE"]
# The test sets git+file:// of its clone, which the bare rockspec builds from.
repository = "https://github.com/tarantool/metrics"

[platform]
tarantool = ">=2.11.0"
tt = ">=3.0.0"

[dependencies]
checks = ">=2.0.0"

[components.metrics]
path = "metrics"
include = ["*"]

[components.override]
path = "metrics"
namespace = "override/metrics"
include = ["*"]
