manifest_version = '0.1'

[package]
name = 'crud-app'
generate_version_lua = false

[platform]
tarantool = '>=3.0.0,<4.0.0'
tt = '>=2.11.0'

[dependencies.crud]
source = 'registry'
version = '==1.2.0-1'

[components.app]
path = '.'
include = ['*.lua']
namespace = ''

[products.default]
components = ['app']
default = true
