credentials:
  users:
    guest:
      roles: [super]

groups:
  group-001:
    replicasets:
      replicaset-001:
        replication:
          bootstrap_strategy: config
          connect_timeout: 3
          # tt instance start waits until both instances are up. Started
          # together, each one finds the other not listening yet more often
          # than not and connects again replication.timeout later, 1 s by
          # default; reconnect_timeout, which sets that pause alone, is
          # Tarantool 3.5+.
          timeout: 0.25
        bootstrap_leader: storage-master
        instances:
          storage-master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            database:
              mode: rw
            app:
              file: 'storage.lua'
          storage-replica:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            database:
              mode: rw
            app:
              file: 'storage.lua'
