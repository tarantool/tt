# A restore target for the sort data app: three directories kept apart, the
# way a Tarantool 3.x deployment does, and the option that makes recovery look
# for a sort data file next to the snapshot it recovers from. Without the
# option the file would be ignored whatever directory it landed in, and the
# restore would have nothing to prove.
#
# It is not started by tt: the test restores into it with `tt restore apply -c`
# and boots Tarantool on the result. Every directory is relative, so all three
# resolve against process.work_dir and that against the directory Tarantool is
# launched from -- which is what `tt restore apply --work-dir` stands in for.
credentials:
  users:
    guest:
      roles: [super]
process:
  work_dir: base
memtx:
  use_sort_data: true
snapshot:
  dir: memtx/{{ instance_name }}
groups:
  storages:
    wal:
      dir: wal/{{ instance_name }}
    replicasets:
      storage-001:
        vinyl:
          dir: vinyl/{{ instance_name }}
        instances:
          storage-001-a:
            database:
              instance_uuid: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'
              replicaset_uuid: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb'
