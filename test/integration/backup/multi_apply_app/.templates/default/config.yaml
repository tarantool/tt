# One replicaset of two instances: the leader the backups are taken on and
# the replica that follows it. The uuids are pinned so a restored node can be
# stamped back to the identity its name owned in the backed-up cluster.
#
# The members replicate over the socket each of them listens on, and a
# sibling's address is read out of this file alone, so the socket tt would
# pick as a per-process default is spelled out here: the two then agree on it
# without any help. The peer login is looked up under credentials above.
credentials:
  users:
    guest:
      roles: [super]
    client:
      password: 'secret'
      roles: [super]
    replicator:
      password: 'secret'
      roles: [replication]
iproto:
  listen:
    - uri: 'unix/:./.tarantool/var/run/app/{{ instance_name }}/tarantool.sock'
  advertise:
    peer:
      login: replicator
groups:
  storages:
    app:
      file: 'storage.lua'
    replication:
      failover: manual
    replicasets:
      storage-001:
        leader: storage-001-a
        database:
          replicaset_uuid: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb'
        instances:
          storage-001-a:
            database:
              instance_uuid: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'
          storage-001-b:
            database:
              instance_uuid: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaab'
