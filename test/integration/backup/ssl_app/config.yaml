# A single storage listening on iproto with TLS. The certificates are the ones
# test/integration/connect/test_ssl_app uses, generated by its generate.sh; the
# paths are relative to the application directory, which is the working
# directory tt starts the instance in.
#
# The port must match SSL_APP_URI in test_ssl.py and stay clear of the ports
# sharded_app/config.yaml takes (3341-3343).
credentials:
  users:
    guest:
      roles: [super]
    client:
      password: 'secret'
      roles: [super]
groups:
  storages:
    app:
      file: 'storage.lua'
    replicasets:
      storage-001:
        instances:
          storage-001-a:
            iproto:
              listen:
                - uri: 'localhost:3344'
                  params:
                    transport: 'ssl'
                    ssl_key_file: 'localhost.key'
                    ssl_cert_file: 'localhost.crt'
                    ssl_ca_file: 'ca.crt'
            database:
              instance_uuid: 'cccccccc-cccc-cccc-cccc-cccccccccccc'
              replicaset_uuid: 'dddddddd-dddd-dddd-dddd-dddddddddddd'
