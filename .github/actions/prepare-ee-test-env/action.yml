name: "Prepare test environment with Tarantool EE"
description: "Prepares test environment with the latest stable Tarantool 3 EE SDK"

inputs:
  ee-username:
    description: Customer-zone username
    required: true
  ee-password:
    description: Customer-zone password
    required: true
  skip-etcd-install:
    description: Whether to skip etcd installation
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '${{ env.GO_VERSION }}'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Setup Mage
      run: go install github.com/magefile/mage@v1.15.0
      shell: bash

    - name: Install build requirements
      run: |
        sudo apt -y update
        sudo apt -y install git gcc make cmake unzip zip fish zsh
      shell: bash

    - name: Enable network isolation for rocks tests
      run: |
        # Ubuntu 24.04 restricts the user namespace used by unshare -r -n.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare -r -n true
      shell: bash

    - name: Build tt
      run: mage build
      shell: bash

    - name: Install the latest stable Tarantool 3 EE SDK
      env:
        EE_USERNAME: ${{ inputs.ee-username }}
        EE_PASSWORD: ${{ inputs.ee-password }}
        TT_USER_ROOT: ${{ runner.temp }}/tt-ee-sdk
      run: |
        umask 077
        credentials=$(mktemp)
        trap 'rm -f "$credentials"' EXIT
        printf '%s\n%s\n' "$EE_USERNAME" "$EE_PASSWORD" > "$credentials"
        ./tt binary install tarantool-sdk 3 --scope user --credentials-file "$credentials"
        "$TT_USER_ROOT/bin/tarantool" --version
        echo "$TT_USER_ROOT/bin" >> "$GITHUB_PATH"
        echo "TT_CLI_TARANTOOL_PREFIX=$TT_USER_ROOT" >> "$GITHUB_ENV"
      shell: bash

    - name: Install etcd
      uses: ./.github/actions/setup-etcd
      if: ${{ inputs.skip-etcd-install == 'false' }}

    - name: Install test requirements
      run: |
        sudo apt -y install gdb
        pip3 install -r test/requirements.txt
      shell: bash
