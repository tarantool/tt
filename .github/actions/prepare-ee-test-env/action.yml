name: "Prepare test environment with Tarantool EE"
description: "Prepares test environment with a stable Tarantool 3 EE SDK"

inputs:
  build-tt:
    description: Build tt when no binary artifact has been supplied
    default: 'true'
  cache:
    description: Enable Go caching
    default: 'true'
  tarantool-version:
    description: SDK series, or min or latest from ci/tarantool-versions.env
    default: latest
  ee-username:
    description: Customer-zone username
    required: true
  ee-password:
    description: Customer-zone password
    required: true
  skip-etcd-install:
    description: Whether to skip etcd installation
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: '**/go.sum'

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Setup Mage
      run: go install github.com/magefile/mage@v1.15.0
      shell: bash

    - name: Install build requirements
      run: |
        sudo apt -y update
        sudo apt -y install git gcc make cmake unzip zip fish zsh
        # Tests that run tt binary install --source-build build Tarantool.
        sudo apt -y install pkg-config libreadline-dev libssl-dev libunwind-dev \
          libicu-dev libncurses-dev zlib1g-dev libcurl4-openssl-dev libyaml-dev
      shell: bash

    - name: Enable network isolation for rocks tests
      run: |
        # Ubuntu 24.04 restricts the user namespace used by unshare -r -n.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare -r -n true
      shell: bash

    - name: Build tt
      if: inputs.build-tt == 'true'
      run: mage build
      shell: bash

    # Resolve the newest stable SDK of the series first, so that every job
    # tests the same SDK and only a new SDK is downloaded again.
    - name: Resolve the EE SDK
      id: sdk
      env:
        REQUESTED: ${{ inputs.tarantool-version }}
        EE_USERNAME: ${{ inputs.ee-username }}
        EE_PASSWORD: ${{ inputs.ee-password }}
      run: |
        series=$(ci/tarantool-version.sh ee "$REQUESTED")
        umask 077
        credentials=$(mktemp)
        trap 'rm -f "$credentials"' EXIT
        printf '%s\n%s\n' "$EE_USERNAME" "$EE_PASSWORD" > "$credentials"
        # --version takes a release directory such as 3.5, not a major
        # version, so list every SDK and pick the series here.
        ./tt binary search tarantool-sdk --credentials-file "$credentials" \
          > "$RUNNER_TEMP/sdk-search.txt"
        sdk=$(awk -v prefix="gc64-$series." \
          'index($1, prefix) == 1 && $1 ~ /^gc64-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-r[0-9]+$/ {print $1}' \
          "$RUNNER_TEMP/sdk-search.txt" | sort -V | tail -n 1)
        if [ -z "$sdk" ]; then
          cat "$RUNNER_TEMP/sdk-search.txt"
          echo "No stable EE SDK found in series $series" >&2
          exit 1
        fi
        echo "EE SDK $series: $sdk" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "version=$sdk" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore the EE SDK
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tt-ee-sdk
        key: tarantool-sdk-${{ steps.sdk.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install the EE SDK
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        SDK: ${{ steps.sdk.outputs.version }}
        EE_USERNAME: ${{ inputs.ee-username }}
        EE_PASSWORD: ${{ inputs.ee-password }}
        TT_USER_ROOT: ${{ runner.temp }}/tt-ee-sdk
      run: |
        umask 077
        credentials=$(mktemp)
        trap 'rm -f "$credentials"' EXIT
        printf '%s\n%s\n' "$EE_USERNAME" "$EE_PASSWORD" > "$credentials"
        ./tt binary install tarantool-sdk "$SDK" --scope user --credentials-file "$credentials"
      shell: bash

    - name: Use the EE SDK
      env:
        TT_USER_ROOT: ${{ runner.temp }}/tt-ee-sdk
      # Only the runner-owned installation directory is exported.
      run: | # zizmor: ignore[github-env]
        "$TT_USER_ROOT/bin/tarantool" --version
        echo "$TT_USER_ROOT/bin" >> "$GITHUB_PATH"
        echo "TT_CLI_TARANTOOL_PREFIX=$TT_USER_ROOT" >> "$GITHUB_ENV"
      shell: bash

    - name: Install etcd
      uses: ./.github/actions/setup-etcd # zizmor: ignore[self-repository] -- Test the checked-out revision.
      if: ${{ inputs.skip-etcd-install == 'false' }}

    - name: Install test requirements
      run: |
        sudo apt -y install gdb
        pip3 install -r test/requirements.txt
      shell: bash
