name: "Prepare test environment with Tarantool CE"
description: "Prepares test environment with Tarantool CE"

inputs:
  tarantool-version:
    description: Tarantool CE version to install
    required: true
  skip-tarantool-install:
    description: Whether to skip tarantool installation
    required: false
    default: 'false'
  skip-etcd-install:
    description: Whether to skip etcd installation
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '${{ env.GO_VERSION }}'

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Setup Mage
      run: go install github.com/magefile/mage@v1.15.0
      shell: bash

    - name: Install build requirements
      run: |
        sudo apt -y update
        sudo apt -y install git gcc make cmake unzip zip
        sudo apt-get --allow-releaseinfo-change update
        sudo apt-get -y -f install \
        build-essential ninja-build \
        liblz4-dev autoconf \
        automake libtool zsh fish
      shell: bash

    - name: Enable network isolation for rocks tests
      run: |
        # Ubuntu 24.04 restricts the user namespace used by unshare -r -n.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare -r -n true
      shell: bash

    - name: Install Tarantool
      if: |
        inputs.skip-tarantool-install == 'false'
      uses: tarantool/setup-tarantool@v3
      with:
        tarantool-version: '${{ inputs.tarantool-version }}'

    - name: Install etcd
      uses: ./.github/actions/setup-etcd
      if: ${{ inputs.skip-etcd-install == 'false' }}

    - name: Build tt
      run: mage build
      shell: bash

    - name: Install test requirements
      run: |
        sudo apt -y install gdb
        pip3 install -r test/requirements.txt
      shell: bash
