name: "Prepare test environment with Tarantool CE"
description: "Prepares test environment with Tarantool CE"

inputs:
  build-tt:
    description: Build tt when no binary artifact has been supplied
    default: 'true'
  cache:
    description: Enable Go caching (disabled for privileged fork runs)
    default: 'true'
  tarantool-version:
    description: Tarantool CE version to install
    required: true
  skip-tarantool-install:
    description: Whether to skip tarantool installation
    required: false
    default: 'false'
  skip-etcd-install:
    description: Whether to skip etcd installation
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: '**/go.sum'

    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Setup Mage
      run: go install github.com/magefile/mage@v1.15.0
      shell: bash

    - name: Install Linux requirements
      if: runner.os == 'Linux'
      run: |
        sudo apt -y update
        sudo apt -y install git gcc make cmake unzip zip
        sudo apt-get --allow-releaseinfo-change update
        sudo apt-get -y -f install \
        build-essential ninja-build \
        liblz4-dev autoconf \
        automake libtool zsh fish gdb
      shell: bash

    - name: Install macOS requirements
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool ninja pkgconf lz4 openssl@3 readline zsh fish
      shell: bash

    - name: Install test requirements
      # Install the pinned CMake before building Tarantool on macOS.
      run: pip3 install -r test/requirements.txt
      shell: bash

    - name: Enable network isolation for rocks tests
      if: runner.os == 'Linux'
      run: |
        # Ubuntu 24.04 restricts the user namespace used by unshare -r -n.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare -r -n true
      shell: bash

    - name: Install Tarantool on Linux
      if: |
        runner.os == 'Linux' && inputs.skip-tarantool-install == 'false'
      uses: tarantool/setup-tarantool@8b72738988f4b0ce0aac18ffd060756871197ec0 # v3
      env:
        # The action's default cache key omits the architecture. CE 3.9 has
        # both amd64 and arm64 packages in its linux-deb/static repository.
        TARANTOOL_CACHE_KEY_SUFFIX: -${{ runner.arch }}
      with:
        tarantool-version: '${{ inputs.tarantool-version }}'

    - name: Install etcd
      uses: ./.github/actions/setup-etcd # zizmor: ignore[self-repository] -- Test the checked-out revision.
      if: ${{ inputs.skip-etcd-install == 'false' }}

    - name: Build tt
      if: inputs.build-tt == 'true'
      run: mage build
      shell: bash

    - name: Install Tarantool on macOS
      if: runner.os == 'macOS' && inputs.skip-tarantool-install == 'false'
      env:
        TARANTOOL_VERSION: ${{ inputs.tarantool-version }}
      # The prefix is fixed by this action, not PR metadata.
      run: | # zizmor: ignore[github-env]
        ./tt binary install tarantool --scope project "$TARANTOOL_VERSION"
        ./.tarantool/bin/tarantool --version
        echo "$GITHUB_WORKSPACE/.tarantool/bin" >> "$GITHUB_PATH"
        echo "TT_CLI_TARANTOOL_PREFIX=$GITHUB_WORKSPACE/.tarantool" >> "$GITHUB_ENV"
      shell: bash
