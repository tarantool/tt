name: Go vulnerability check

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        description: >-
          Commit to compare module files with; the merge base with the default
          branch when empty. The scan is skipped when no go.mod or go.sum changed.
        type: string
        default: ''
      scan-all:
        description: Scan even when no module file changed (nightly)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A branch is compared with the default branch rather than with its
      # previous push, so a later commit cannot hide an earlier module change.
      - name: Check dependency changes
        id: changes
        env:
          BASE: ${{ inputs.base }}
          SCAN_ALL: ${{ inputs.scan-all }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          fi
          changed=true
          if [ "$SCAN_ALL" != true ] &&
            git diff --quiet "$BASE...HEAD" -- ':(glob)**/go.mod' ':(glob)**/go.sum'; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Dependency scan requested: $changed" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'

      - name: Install scanners
        if: steps.changes.outputs.changed == 'true'
        run: |
          go install github.com/magefile/mage@v1.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check every project module
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -o pipefail
          mkdir -p reports
          ci/retry-network.sh mage lint:vuln 2>&1 | tee reports/govulncheck.log

      - name: Upload vulnerability report
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck
          path: reports/
          retention-days: 7
