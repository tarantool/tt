name: Build tt

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit
        type: string
        required: true
      build-ssl:
        description: Build variant (default, openssl, openssl_static)
        type: string
        default: default
      artifact-name:
        description: Name of the binary artifact
        type: string
        required: true
      environment:
        description: Required approval environment for privileged fork runs
        type: string
        default: ''
      cache:
        description: Enable Go caching only for unprivileged or trusted runs
        type: boolean
        default: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          # Fork code runs only after ee-fork approval, with a read-only token and no cache.
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: '**/go.sum'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          go install github.com/magefile/mage@v1.15.0

      - name: Build tt
        env:
          TT_CLI_BUILD_SSL: ${{ inputs.build-ssl }}
        run: mage build

      - name: Test the OpenSSL dialer
        if: inputs.build-ssl == 'openssl'
        run: go -C sdk/dial test -tags openssl ./...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: tt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
