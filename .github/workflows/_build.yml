name: Build tt

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit
        type: string
        required: true
      mode:
        description: build, snapshot, or release
        type: string
        default: build
      runner:
        type: string
        default: ubuntu-24.04
      build-ssl:
        description: Build variant (default, openssl, openssl_static)
        type: string
        default: default
      artifact-name:
        description: Name of the binary artifact
        type: string
        required: true
      cache:
        description: Enable Go caching for builds
        type: boolean
        default: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # This workflow only builds artifacts (--snapshot or --skip=publish).
      # Release builds disable caches; publishing happens in an uncached job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # zizmor: ignore[cache-poisoning] -- v7.0.0; release builds disable caches.
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ inputs.mode != 'release' && inputs.cache }}
          cache-dependency-path: '**/go.sum'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          go install github.com/magefile/mage@v1.15.0

      - name: Validate build mode
        env:
          MODE: ${{ inputs.mode }}
          SSL: ${{ inputs.build-ssl }}
        run: |
          case "$MODE" in build|snapshot|release) ;; *) exit 2 ;; esac
          case "$SSL" in default|openssl|openssl_static) ;; *) exit 2 ;; esac
          if [ "$MODE" != build ] && [ "$SSL" = openssl ]; then
            echo 'Packages support default and openssl_static builds only' >&2
            exit 2
          fi

      - name: Build tt
        if: inputs.mode == 'build'
        env:
          TT_CLI_BUILD_SSL: ${{ inputs.build-ssl }}
        run: mage build

      - name: Test the OpenSSL dialer
        if: inputs.mode == 'build' && inputs.build-ssl == 'openssl'
        run: go -C sdk/dial test -tags openssl ./...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'build'
        with:
          name: ${{ inputs.artifact-name }}
          path: tt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Generate shell completions
        if: inputs.mode != 'build'
        env:
          CGO_ENABLED: '0'
        run: |
          mage build
          mkdir -p dist/completions
          ./tt completion bash > dist/completions/tt.bash
          ./tt completion zsh > dist/completions/tt.zsh
          ./tt completion fish > dist/completions/tt.fish

      - name: Select package configuration
        if: inputs.mode != 'build'
        id: package
        env:
          MODE: ${{ inputs.mode }}
          SSL: ${{ inputs.build-ssl }}
        run: |
          flags=--skip=publish
          if [ "$MODE" = snapshot ]; then
            flags=--snapshot
          fi
          config=goreleaser/.goreleaser.yml
          dist=dist/default
          if [ "$SSL" = openssl_static ]; then
            config=goreleaser/.goreleaser_openssl.yml
            dist=dist/openssl
          fi
          {
            echo "arch=$(go env GOHOSTARCH)"
            echo "flags=$flags"
            echo "config=$config"
            echo "dist=$dist"
          } >> "$GITHUB_OUTPUT"

      - name: Build release packages
        if: inputs.mode != 'build'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean ${{ steps.package.outputs.flags }} --config ${{ steps.package.outputs.config }}
        env:
          GOARCH: ${{ steps.package.outputs.arch }}

      - name: Check and collect package artifacts
        if: inputs.mode != 'build'
        env:
          DIST: ${{ steps.package.outputs.dist }}
          SSL: ${{ inputs.build-ssl }}
          ARCH: ${{ steps.package.outputs.arch }}
        run: python3 ci/package_artifacts.py "$DIST" --variant "$SSL" --arch "$ARCH"

      - name: Upload packages and archives
        if: inputs.mode != 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Linux amd64 binary
        if: inputs.mode != 'build' && (inputs.build-ssl == 'default' || steps.package.outputs.arch == 'amd64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tt-${{ inputs.mode }}-${{ inputs.build-ssl }}-linux-amd64
          path: dist/binaries/linux-amd64/tt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Linux arm64 binary
        if: inputs.mode != 'build' && (inputs.build-ssl == 'default' || steps.package.outputs.arch == 'arm64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tt-${{ inputs.mode }}-${{ inputs.build-ssl }}-linux-arm64
          path: dist/binaries/linux-arm64/tt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload macOS arm64 binary
        if: inputs.mode != 'build' && inputs.build-ssl == 'default'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tt-${{ inputs.mode }}-default-darwin-arm64
          path: dist/binaries/darwin-arm64/tt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
