name: publish

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:
    inputs:
      allow-incompatible-sdk:
        description: >-
          Release the tag even though its SDK API is incompatible with the
          stable release before it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v3' && github.ref != 'refs/heads/master' }}

env:
  GO_VERSION: '1.27.4'

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a tag from a release branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          commit=$(git rev-parse "$GITHUB_REF^{commit}")
          for branch in v3 master; do
            if git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch"; then
              exit 0
            fi
          done
          echo 'The release tag must belong to origin/v3 or origin/master' >&2
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install apidiff
        if: startsWith(github.ref, 'refs/tags/')
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e

      # A stable release, vX.Y.Z, is compared with the stable release before
      # it of its major version, and an incompatible change of the SDK fails
      # it; a pre-release, and the first stable release of a major version,
      # with the release just before it, and an incompatible change only
      # warns (ci/pr_notes.py, release_base). To release a break on purpose,
      # run the workflow on the tag with allow-incompatible-sdk.
      - name: Check the SDK API against the release before
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ALLOW_INCOMPATIBLE_SDK: ${{ inputs.allow-incompatible-sdk == true }}
        run: |
          flags=()
          if [ "$ALLOW_INCOMPATIBLE_SDK" = true ]; then
            flags+=(--allow-incompatible)
          fi
          python3 ci/pr_notes.py api --release "$GITHUB_REF_NAME" "${flags[@]}"

  packages:
    needs: validate-tag
    uses: ./.github/workflows/_packages.yml # zizmor: ignore[self-repository] -- Build packages from the workflow revision being released.
    with:
      ref: ${{ github.sha }}
      snapshot: ${{ !startsWith(github.ref, 'refs/tags/') }}
      cache: false

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release

      - name: Add source and dependency archives
        run: |
          ./.gen_tarballs.sh -t "$GITHUB_REF_NAME"
          mv /tmp/gentoo_tarballs/tt*.tar.* dist/release/

      - name: Create release checksums
        run: |
          cd dist/release
          rm -- *checksums.txt
          sha256sum -- *.deb *.rpm *.tar.gz *.tar.xz > checksums.txt

      - name: Create or update the draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --config goreleaser/.goreleaser_publish.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release keeps the packages as assets of the draft release, which is
  # where they are taken from now, so nothing is pushed to RWS on a tag.
