name: Documentation

# Builds the documentation site for every change of its sources and publishes
# the one of v3 at https://tarantool.github.io/tt/ as a preview. The command
# reference is generated from the help of tt, which help.golden pins.

on:
  push:
    branches:
      - v3
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'core/testdata/help.golden'
      - 'cli/cmd/clidoc/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'core/testdata/help.golden'
      - 'cli/cmd/clidoc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the tools
        run: |
          go install github.com/magefile/mage@v1.15.0
          python3 -m pip install -r doc/requirements.txt

      # Fails on a broken link or anchor, and on a page the nav omits, such
      # as the reference of a new command.
      - name: Build the site
        run: mage docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 7

  # The github-pages environment must allow deployments from v3.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v3'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
