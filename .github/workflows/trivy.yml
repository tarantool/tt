---
name: Trivy

# Trivy reports every vulnerable module or package a manifest names; this is
# what a scanner of a user of tt reports. The tt binary is scanned too: it
# holds the modules, the vendored cartridge-cli among them, and the Go
# toolchain that went into the build.
#
# Trivy runs in a container that sees only what it scans. In March 2026 the
# trivy-action tags and a Trivy release were replaced with a stealer that read
# the secrets of a job from the memory of the runner process (CVE-2026-33634),
# so here:
# - the image is pinned by digest, no action of Aqua runs, and the workflow
#   passes no secret;
# - the scan job does not build: tt is built by its own job and handed over
#   as an artifact, so the scan job sets up neither Go nor caches;
# - the container gets neither the environment of the runner nor its tokens
#   (ACTIONS_RUNTIME_TOKEN would let it poison caches), nor its processes, nor
#   the Docker socket, and it runs as the runner user with no capabilities;
# - the database is fetched by a container that sees nothing but the cache,
#   and the scan runs with no network and read-only sources.

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    # Advisories are published without a change here.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Note: Use exactly match version of tool, to avoid unexpected issues with test on CI.
  GO_VERSION: '1.26.10'
  # Trivy 0.76.1, the same index in ghcr.io, docker.io and public.ecr.aws.
  # Its /usr/local/bin/trivy is byte for byte the binary of
  # trivy_0.76.1_Linux-64bit.tar.gz, whose sigstore bundle verifies against
  # reusable-release.yaml@refs/tags/v0.76.1 of aquasecurity/trivy. Check a
  # new digest the same way before updating it: the images are not signed.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  # A pull request is blocked only by a change of what tt depends on, not by
  # an advisory published meanwhile; pushes and the schedule scan anyway.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check dependency changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [ -n "$BASE" ] &&
            git diff --quiet "$BASE...HEAD" -- ':(glob)**/go.mod' ':(glob)**/go.sum' \
              ':(glob)**/requirements*.txt' .trivyignore.yaml .github/workflows/trivy.yml \
              cli/cartridge/third_party/cartridge-cli; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Dependency scan requested: $changed" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # Tags run this workflow too, so the build takes nothing from a cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Mage
        run: go install github.com/magefile/mage@v1.15.0

      # The OpenSSL variant of the release packages.
      - name: Build tt
        env:
          TT_CLI_BUILD_SSL: 'static'
        run: mage build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tt-trivy
          path: tt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  trivy:
    needs: [changes, build]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # Submodules stay out: their manifests are not what tt builds with, and
      # what the build takes from them is in the binary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare scan directories
        run: mkdir -p "$RUNNER_TEMP/trivy/cache" "$RUNNER_TEMP/trivy/bin" "$RUNNER_TEMP/trivy/out"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-trivy
          path: ${{ runner.temp }}/trivy/bin

      - name: Pull Trivy
        run: docker pull --quiet "$TRIVY_IMAGE"

      - name: Download the vulnerability database
        run: |
          docker run --rm \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$RUNNER_TEMP/trivy/cache:/cache" \
            "$TRIVY_IMAGE" fs --download-db-only --cache-dir /cache \
            --no-progress --skip-version-check --disable-telemetry

      # Fails on a HIGH or CRITICAL vulnerability that .trivyignore.yaml does
      # not list, whether or not a fixed version exists.
      - name: Scan dependencies
        run: |
          trivy() {
            docker run --rm --network none \
              --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$RUNNER_TEMP/trivy/cache:/cache:ro" \
              --volume "$PWD:/src:ro" \
              --volume "$RUNNER_TEMP/trivy/bin:/scan-bin:ro" \
              --volume "$RUNNER_TEMP/trivy/out:/out" \
              "$TRIVY_IMAGE" "$@"
          }

          # name, scan command and target
          scan() {
            local status=0
            trivy "$2" "$3" --cache-dir /cache --skip-db-update --offline-scan \
              --no-progress --skip-version-check --disable-telemetry \
              --scanners vuln --severity HIGH,CRITICAL \
              --ignorefile /src/.trivyignore.yaml \
              --exit-code 1 --format json --output "/out/$1.json" || status=$?
            trivy convert --format table --output "/out/$1.txt" "/out/$1.json"
            cat "$RUNNER_TEMP/trivy/out/$1.txt"
            {
              echo "### Trivy: $1"
              if [ -s "$RUNNER_TEMP/trivy/out/$1.txt" ]; then
                echo '```'
                cat "$RUNNER_TEMP/trivy/out/$1.txt"
                echo '```'
              else
                echo 'No HIGH or CRITICAL vulnerabilities.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            return "$status"
          }

          failed=0
          scan sources fs /src || failed=1
          # Artifacts lose the executable bit, and Trivy reads only an
          # executable as a Go binary; a file it skips passes silently.
          chmod +x "$RUNNER_TEMP/trivy/bin/tt"
          scan binary rootfs /scan-bin || failed=1
          if ! jq -e 'any(.Results[]?; .Type == "gobinary")' \
            "$RUNNER_TEMP/trivy/out/binary.json" > /dev/null; then
            echo "::error::Trivy found no Go binary in the tt artifact"
            failed=1
          fi
          exit "$failed"

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy
          path: ${{ runner.temp }}/trivy/out/
          if-no-files-found: ignore
          retention-days: 7
