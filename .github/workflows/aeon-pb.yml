---
name: Aeon bindings

# The committed bindings are determined by these files alone: buf.gen.yaml
# pins the schema commit and the plugins, generate-pb.sh pins buf and the Go
# toolchain. A change anywhere else cannot change what the script generates.
on:
  push:
    paths:
      - 'modules/aeon/pb/**'
      - 'modules/aeon/buf.gen.yaml'
      - 'modules/aeon/generate-pb.sh'
      - '.github/workflows/aeon-pb.yml'
  pull_request:
    paths:
      - 'modules/aeon/pb/**'
      - 'modules/aeon/buf.gen.yaml'
      - 'modules/aeon/generate-pb.sh'
      - '.github/workflows/aeon-pb.yml'

env:
  # Note: Use exactly match version of tool, to avoid unexpected issues with test on CI.
  GO_VERSION: '1.27.1'

jobs:
  # Regenerate modules/aeon/pb and fail when it differs from the committed files.
  aeon-pb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only go is needed: the script runs buf and the plugins with go run
      # and switches to the Go toolchain it pins.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          # Nothing from the tt module cache is used here.
          cache: false

      - name: Generate the bindings
        run: modules/aeon/generate-pb.sh
        shell: bash

      - name: Compare with the committed bindings
        run: |
          rc=0
          git diff --exit-code -- modules/aeon/pb || rc=1
          untracked=$(git ls-files --others -- modules/aeon/pb)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed:"
            echo "$untracked"
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "modules/aeon/pb does not match modules/aeon/generate-pb.sh output."
            echo "Run modules/aeon/generate-pb.sh and commit the result."
          fi
          exit "$rc"
        shell: bash
