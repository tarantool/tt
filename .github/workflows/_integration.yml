name: Integration tests

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit
        type: string
        required: true
      edition:
        description: ce, ee, or none for tests without Tarantool
        type: string
        required: true
      tarantool-version:
        description: min or latest from ci/tarantool-versions.env, a CE version or an EE SDK series
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-24.04
      shard:
        description: Group from test/shards.yaml, several separated by commas, or all
        type: string
        default: all
      marker:
        type: string
        required: true
      tt-source:
        description: build or snapshot, recorded with the binary provenance
        type: string
        default: build
      tt-artifact:
        description: Binary produced by _build.yml
        type: string
        default: tt-default
      test-dir:
        description: Optional single integration directory (ee for credential tests)
        type: string
        default: ''
      ee-credentials:
        description: Expose customer-zone credentials to the EE tests
        type: boolean
        default: false
      full:
        description: Enable coredump tests on the disposable runner
        type: boolean
        default: false
      require-debug-info:
        description: >-
          Fail rather than skip the coredump tests whose tarantool gdb finds no
          debugging information for
        type: boolean
        default: false
      gdb-tools-upstream:
        description: >-
          Check the vendored tarantool-gdb-tools against their commit on GitHub,
          which one job does
        type: boolean
        default: false
      pie-tarantool:
        description: >-
          Build Tarantool CE from its source as a PIE, the newest release the
          manifest of the vendored tarantool-gdb-tools covers, or restore the
          build from the cache, for the coredump tests to take a core of as
          well (TT_TEST_PIE_TARANTOOL); needs full and require-debug-info
        type: boolean
        default: false
      rocks-mirror:
        description: Build the rock mirror the tests that fetch rocks install from
        type: boolean
        default: true
      cache:
        type: boolean
        default: true
      continue-on-error:
        type: boolean
        default: false
      timeout-minutes:
        description: Time for environment preparation and tests
        type: number
        default: 60
    secrets:
      TT_EE_USERNAME:
        required: false
      TT_EE_PASSWORD:
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'
  PYTHON_VERSION: '3.12'

jobs:
  integration:
    # EE is restricted here as well as in callers so fork code never gets its secrets.
    if: >-
      ${{ inputs.edition != 'ee' || (github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: ${{ inputs.continue-on-error }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # The test-dir of the name of the test reports: that of a file,
      # coredump/test_gdb_tools.py, is coredump-test_gdb_tools.py there.
      - name: Name the test reports
        id: reports
        env:
          TEST_DIR: ${{ inputs.test-dir || 'all' }}
        run: echo "test-dir=${TEST_DIR//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tt-artifact }}

      - name: Prepare binary
        env:
          EDITION: ${{ inputs.edition }}
          TT_SOURCE: ${{ inputs.tt-source }}
          TT_ARTIFACT: ${{ inputs.tt-artifact }}
        run: |
          case "$EDITION" in ce|ee|none) ;; *) exit 2 ;; esac
          case "$TT_SOURCE" in build|snapshot) ;; *) exit 2 ;; esac
          echo "Testing $TT_SOURCE binary from artifact $TT_ARTIFACT"
          shasum -a 256 tt
          chmod +x tt
          ./tt version

      - name: Prepare CE environment
        if: inputs.edition != 'ee'
        uses: ./.github/actions/prepare-ce-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: ${{ inputs.tarantool-version }}
          skip-tarantool-install: ${{ inputs.edition == 'none' }}
          skip-etcd-install: ${{ inputs.edition == 'none' }}
          build-tt: 'false'
          cache: ${{ inputs.cache }}

      - name: Prepare EE environment
        if: inputs.edition == 'ee'
        uses: ./.github/actions/prepare-ee-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: ${{ inputs.tarantool-version }}
          ee-username: ${{ secrets.TT_EE_USERNAME }}
          ee-password: ${{ secrets.TT_EE_PASSWORD }}
          build-tt: 'false'
          cache: ${{ inputs.cache }}

      # The package tests of the tooling group build components with cargo
      # (a static program for the musl target, too) and zig.
      - name: Set up the toolchains of the build backends
        if: contains(inputs.shard, 'tooling') || inputs.shard == 'all'
        uses: ./.github/actions/setup-build-toolchains # zizmor: ignore[self-repository] -- Test the checked-out revision.

      # rocks/test_luarocks_compat.py of the tooling group builds the source
      # rocks of tt packages with tt rocks of tt 2, a plain LuaRocks 3.9.2,
      # named by TT_TEST_TT2. tt 2 has releases for Linux; for macOS on arm64
      # it has none, and Homebrew bottles it. The formula of the runner image
      # may be one that still depends on bash-completion, which conflicts
      # with the bash-completion@2 of the image, so the bottle goes in
      # without the dependencies of the formula and with the one library tt
      # links, openssl@3.
      - name: Set up tt 2 for the LuaRocks tests
        if: inputs.edition != 'none' && (contains(inputs.shard, 'tooling') || inputs.shard == 'all')
        env:
          TT2_VERSION: 2.15.2
          HOMEBREW_NO_AUTO_UPDATE: '1'
        # The path is fixed by this step, not PR metadata.
        run: | # zizmor: ignore[github-env]
          if [ "$RUNNER_OS" = macOS ]; then
            brew install openssl@3
            brew install --ignore-dependencies tt
            # Off PATH and out of the completions the tests load.
            brew unlink tt
            tt2="$(brew --prefix tt)/bin/tt"
          else
            case "$RUNNER_ARCH" in
              X64) arch=amd64 ;;
              ARM64) arch=arm64 ;;
              *) echo "tt $TT2_VERSION has no release for $RUNNER_ARCH" >&2; exit 1 ;;
            esac
            dir="$RUNNER_TEMP/tt2"
            archive="tt-$TT2_VERSION-linux-$arch.tar.gz"
            url="https://github.com/tarantool/tt/releases/download/v$TT2_VERSION"
            mkdir -p "$dir"
            curl -fsSL --retry 3 -o "$dir/$archive" "$url/$archive"
            curl -fsSL --retry 3 -o "$dir/checksums.txt" "$url/checksums.txt"
            (cd "$dir" && grep -F "  $archive" checksums.txt | sha256sum -c -)
            tar -xzf "$dir/$archive" -C "$dir" tt
            tt2="$dir/tt"
          fi
          "$tt2" version
          echo "TT_TEST_TT2=$tt2" >> "$GITHUB_ENV"

      # The tests that fetch rocks install them from this directory rather
      # than from the registries; see test/rocks-mirror.txt. A job of tests
      # that fetch none goes without it.
      - name: Restore the rock mirror
        id: rocks-mirror
        if: inputs.cache && inputs.rocks-mirror && inputs.edition != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rocks-mirror
          key: rocks-mirror-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/rocks-mirror.txt') }}

      - name: Build the rock mirror
        if: inputs.rocks-mirror && inputs.edition != 'none' && steps.rocks-mirror.outputs.cache-hit != 'true'
        run: ci/retry-network.sh python3 test/ci.py rocks-mirror --dir "$RUNNER_TEMP/rocks-mirror" --tt-cmd "$PWD/tt"

      # The PIE is there for the relocation, not for the newest Tarantool: it
      # is the newest release the manifest of the vendored extensions says
      # they are checked on, the last max of its ranges, whatever version the
      # tarantool of PATH is of, so that every test of the extensions runs on
      # it once the latest Tarantool of CI is past the manifest. The cache is
      # keyed by that release.
      - name: Resolve the release to build as a PIE
        id: pie-release
        if: inputs.pie-tarantool
        env:
          EDITION: ${{ inputs.edition }}
          FULL: ${{ inputs.full }}
          REQUIRE_DEBUG_INFO: ${{ inputs.require-debug-info }}
          MANIFEST: modules/coredump/internal/coredump/extensions/gdb-tools/extensions.json
        run: |
          # Without the coredump tests, or with a skip of the tests of a
          # tarantool gdb finds no debugging information of, the PIE would go
          # untested and the job green.
          if [ "$EDITION" != ce ] || [ "$FULL" != true ] || [ "$REQUIRE_DEBUG_INFO" != true ]; then
            echo "pie-tarantool needs edition ce, full and require-debug-info" >&2
            exit 2
          fi
          # A max that is no release x.y.z fails the step.
          release=$(python3 -c '
          import json
          import sys

          ranges = [entry["tarantool"] for entry in json.load(open(sys.argv[1]))["extensions"]]
          print(max((r["max"] for r in ranges), key=lambda v: tuple(map(int, v.split(".")))))
          ' "$MANIFEST")
          if ! [[ $release =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The newest max of $MANIFEST is no release x.y.z: $release" >&2
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      # The binary links the libraries of the image, which the runner names.
      - name: Restore the tarantool built as a PIE
        id: pie-cache
        if: inputs.pie-tarantool && inputs.cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tarantool-pie
          key: tarantool-pie-${{ steps.pie-release.outputs.release }}-${{ inputs.runner }}-${{ runner.arch }}-${{ hashFiles('ci/build-tarantool-pie.sh') }}

      # On a hit of the cache the script only checks the binary.
      - name: Build the tarantool as a PIE
        id: pie
        if: inputs.pie-tarantool
        env:
          RELEASE: ${{ steps.pie-release.outputs.release }}
        run: |
          tarantool=$(ci/build-tarantool-pie.sh "$RELEASE" "$RUNNER_TEMP/tarantool-pie")
          echo "tarantool=$tarantool" >> "$GITHUB_OUTPUT"

      # Right after the build, not at the end of the job: a test that fails
      # does not cost the next run the build.
      - name: Save the tarantool built as a PIE
        if: inputs.pie-tarantool && inputs.cache && steps.pie-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tarantool-pie
          key: ${{ steps.pie-cache.outputs.cache-primary-key }}

      - name: Run integration tests
        env:
          SHARD: ${{ inputs.shard }}
          MARKER: ${{ inputs.marker }}
          TEST_DIR: ${{ inputs.test-dir }}
          FULL: ${{ inputs.full }}
          REQUIRE_DEBUG_INFO: ${{ inputs.require-debug-info }}
          GDB_TOOLS_UPSTREAM: ${{ inputs.gdb-tools-upstream }}
          PIE: ${{ inputs.pie-tarantool }}
          PIE_TARANTOOL: ${{ steps.pie.outputs.tarantool }}
          EE_CREDENTIALS: ${{ inputs.ee-credentials }}
          TT_CLI_EE_USERNAME: ${{ inputs.ee-credentials && secrets.TT_EE_USERNAME || '' }}
          TT_CLI_EE_PASSWORD: ${{ inputs.ee-credentials && secrets.TT_EE_PASSWORD || '' }}
        run: |
          go version -m ./tt
          # No TT_ENABLE_DOCKER_CLEANUP: the prune it turns on runs when the
          # session ends, after the last test, and this job runs one session
          # on a runner that is thrown away after it.
          if [ "$FULL" = true ]; then
            export TT_ENABLE_COREDUMP_TESTS=1
          fi
          if [ "$REQUIRE_DEBUG_INFO" = true ]; then
            export TT_TEST_REQUIRE_DEBUG_INFO=1
          fi
          if [ "$GDB_TOOLS_UPSTREAM" = true ]; then
            export TT_TEST_GDB_TOOLS_UPSTREAM=1
          fi
          # Unset, the tests of the PIE skip: it is set or the job fails.
          if [ "$PIE" = true ]; then
            export TT_TEST_PIE_TARANTOOL="${PIE_TARANTOOL:?names no tarantool built as a PIE}"
          fi
          if [ "$EE_CREDENTIALS" != true ]; then
            unset TT_CLI_EE_USERNAME TT_CLI_EE_PASSWORD
          fi
          if [ -d "$RUNNER_TEMP/rocks-mirror" ]; then
            export TT_TEST_ROCKS_MIRROR="$RUNNER_TEMP/rocks-mirror"
          fi
          # The TMPDIR of macOS is a long path behind the /var -> /private/var
          # symlink; the runner's temporary directory is a real and a shorter
          # one.
          if [ "$RUNNER_OS" = macOS ]; then
            export TMPDIR="$RUNNER_TEMP"
          fi
          extra=()
          if [ -n "$TEST_DIR" ]; then
            extra+=(--test-dir "$TEST_DIR")
          fi
          python3 test/ci.py run --shard "$SHARD" --marker "$MARKER" \
            --tt-cmd "$PWD/tt" --report-dir reports "${extra[@]}"

      # A test of the PIE skips for more than the variable: all of them
      # without gdb, one of an extension on a release its manifest does not
      # cover. Each must have passed, but the expected failure of
      # tarantool-gdb-tools#14, which is strict.
      - name: Check that the tests ran on the tarantool built as a PIE
        if: inputs.pie-tarantool
        run: |
          python3 - reports/junit.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          XFAILED = {"test_gdb_tools_box_tuple_t[pie]"}
          cases = []
          unexpected = []
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              name = case.get("name", "")
              if not name.endswith("[pie]"):
                  continue
              cases.append(name)
              # An expected failure is a skip of type pytest.xfail there.
              outcomes = [
                  "xfailed" if child.get("type") == "pytest.xfail" else child.tag
                  for child in case
                  if child.tag in ("skipped", "failure", "error")
              ]
              messages = [child.get("message", "") for child in case if child.tag == "skipped"]
              outcome = ", ".join(outcomes) or "passed"
              print(f"{name}: {outcome}", *messages, sep="\n    ")
              if outcome != "passed" and not (outcome == "xfailed" and name in XFAILED):
                  unexpected.append(name)
          if not cases:
              sys.exit("no test of the tarantool built as a PIE ran")
          if unexpected:
              sys.exit(f"tests of the tarantool built as a PIE did not pass: {', '.join(unexpected)}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The runner tells apart the jobs of one directory on several. The
          # name of an artifact has no slash, which a test-dir of a file has.
          name: pytest-${{ inputs.edition }}-${{ inputs.tarantool-version }}-${{ inputs.shard }}-${{ steps.reports.outputs.test-dir }}-${{ inputs.tt-artifact }}-${{ inputs.runner }}
          path: reports/
          retention-days: 7
