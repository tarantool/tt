---
name: Tests

on:
  push:
    branches-ignore:
      - 'master'
  pull_request:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v3' && github.ref != 'refs/heads/master' }}

env:
  # Note: Use exactly match version of tool, to avoid unexpected issues with test on CI.
  GO_VERSION: '1.27.3'
  PYTHON_VERSION: '3.12'

jobs:
  # Run project-wide lint and consistency checks on every push and pull request.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Setup Mage
        run: go install github.com/magefile/mage@v1.15.0
        shell: bash

      # Linter releases add checks, so keep the CI version in sync with the
      # version required by mage lint:golang.
      - name: Setup golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install Python linters
        shell: bash
        run: python3 -m pip install -r <(grep -E '^(ruff|codespell)==' test/requirements.txt)

      - name: Setup stringer
        run: go install golang.org/x/tools/cmd/stringer@v0.52.0

      - name: Go lint
        run: mage lint:golang

      - name: Python lint and formatting
        run: mage lint:python

      - name: Spelling
        run: mage codespell

      - name: Check generated sources
        run: |
          mage generate
          git diff --exit-code

      - name: Check Go modules
        run: mage lint:modules

      - name: Build tt for license checks
        run: mage build

      - name: Install license checker
        run: go install github.com/uw-labs/lichen@latest

      - name: License checker
        shell: bash
        run: |
          network_errors='stream error|INTERNAL_ERROR|connection (reset|refused|timed out)'
          network_errors+='|i/o timeout|TLS handshake timeout|no such host|network is unreachable'
          network_errors+='|temporary failure|unexpected EOF|context deadline exceeded'
          network_errors+='|HTTP[^[:digit:]]*5[0-9]{2}|[[:space:]]5[0-9]{2}[[:space:]]'
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2 3; do
            if mage checklicenses 2>&1 | tee "$log"; then
              exit 0
            fi
            # Retry network failures, but fail immediately on license violations.
            if ! grep -Eiq "$network_errors" "$log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

  tests-ce:
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.owner.login != 'tarantool' &&
        !contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tarantool-version: ["3.3", "3.9"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CE env
        uses: ./.github/actions/prepare-ce-test-env
        with:
          tarantool-version: '${{ matrix.tarantool-version }}'

      - name: Go tests with integration
        run: mage unit:fullSkipDocker

      - name: Integration tests
        run: mage integration

  tests-ce-linux-arm64:
    if: false
    runs-on: graviton
    strategy:
      fail-fast: false
    container:
      image: tarantool/testing:tt-build
      options: '--init --privileged'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install test requirements
        run: |
          pip3 install setuptools==59.5.0
          # Limiting the number of jobs for building Python-GRPCIO is a workaround for the
          # Out Of Memory (OOM) killer on AArch64 runners.
          GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS=6 pip3 install -r test/requirements.txt
        shell: bash

      - name: Install etcd
        uses: ./.github/actions/setup-etcd

      - name: Build test
        run: mage build

      - name: Go tests with integration
        run: mage unit:fullSkipDocker

      - name: Integration tests
        run: mage integration

  tests-ee:
    # The same as for tests-ce, but it does not run on pull requests from
    # forks by default. Tests will run only when the pull request is labeled
    # with `ee-ci`. To avoid security problems, the label must be reset
    # manually for every run.
    #
    # We need to use `pull_request_target` because it has access to base
    # repository secrets unlike `pull_request`.
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.owner.login != 'tarantool' &&
        !contains(github.event.pull_request.labels.*.name, 'full-ci') &&
        github.event.label.name == 'ee-ci')
    runs-on: ubuntu-24.04
    steps:
        # `ref` as merge request is needed for pull_request_target because this
        # target runs in the context of the base commit of the pull request.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request_target'
        with:
          fetch-depth: 0

      - name: Prepare EE env
        uses: ./.github/actions/prepare-ee-test-env
        with:
          ee-username: '${{ secrets.TT_EE_USERNAME }}'
          ee-password: '${{ secrets.TT_EE_PASSWORD }}'

      - name: Go tests with integration
        run: mage unit:fullSkipDocker

      - name: Integration tests
        run: mage integration

  tests-mac-os-ce:
    if: false
    runs-on: [self-hosted, macOS-13-self-hosted, x86_64, regular]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install dependencies
        run: |
          brew install --overwrite mage node
          pip3 install -r test/requirements.txt

      - name: Install etcd
        uses: ./.github/actions/setup-etcd

      - name: Build tt
        run: mage build

      # The checkout is no project: the project scope installs into
      # .tarantool/ of the working directory, the binary into
      # .tarantool/bin and the headers into .tarantool/include/tarantool.
      - name: Install tarantool
        run: |
          ./tt -V binary install tarantool --scope project 3.9

      - name: Add Tarantool to Path
        run: |
          echo "${GITHUB_WORKSPACE}/.tarantool/bin" >> $GITHUB_PATH

      - name: Set Tarantool include directory to the environment
        run: |
          echo "TT_CLI_TARANTOOL_PREFIX=${GITHUB_WORKSPACE}/.tarantool" >> $GITHUB_ENV

      # Sometimes CI on macOS terminates with a “docker daemon not running” error.
      # To prevent this we set the path to the docker socket directly.
      - name: Prepare Docker
        run: |
          echo "DOCKER_HOST=unix:///${HOME}/.docker/run/docker.sock" >> $GITHUB_ENV
          docker context use default

      - name: Go tests with integration
        run: mage unit:fullSkipDocker

      # We need to override TMPDIR here because of the very long path in macOS tests
      # which causes a very long socket path error.
      - name: Run integration tests
        run: TMPDIR=/tmp mage integration

      # Etcd can be still running after integration tests when:
      # 1. pytest recieve SIGALRM (can be caused by pytest-timeout plugin)
      # 2. when pytest crashes
      # In both cases finalizers are not invoked, so etcd is not stopped.
      - name: Kill etcd, if it was left after integration tests
        if: always()
        run: |
          ETCD_TT_BIN=${ETCD_PATH}etcd;
          pkill -SIGINT -f ${ETCD_TT_BIN} || true
