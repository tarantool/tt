name: Full CI

# full-ok joins the required checks on one source SHA. Forks run CE only,
# and fork-status.yml publishes full-ok from the result of their ce-result.
on:
  push:
    branches: [v3, master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  # An unrelated label must not cancel a requested full run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'tests' }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/v3' && github.ref != 'refs/heads/master') }}

env:
  GO_VERSION: '1.27.3'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    if: >-
      ${{ github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci')) }}
    uses: ./.github/workflows/_build.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-name: tt-default

  full-start:
    if: >-
      ${{ github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
        run: python3 ci/status.py

  go-docker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-default

      - name: Prepare binary
        run: chmod +x tt

      - name: Prepare CE environment
        uses: ./.github/actions/prepare-ce-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: latest
          build-tt: 'false'

      - name: Go tests including Docker integration
        run: mage unit:full

  it-ce:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [min, latest]
        shard: [cluster, replicaset, instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool
      full: true

  it-ee:
    needs: build
    if: >-
      ${{ github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [min, latest]
        shard: [cluster, replicaset, instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool
      full: true
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  ee-creds:
    needs: build
    if: >-
      ${{ github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: latest
      marker: ''
      test-dir: ee
      ee-credentials: true
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  notarantool:
    needs: build
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: none
      tarantool-version: ''
      marker: notarantool

  # fork-status.yml publishes full-ok from the result of this job.
  ce-result:
    if: >-
      ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    needs: [build, go-docker, it-ce, notarantool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the unprivileged jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(not all(job["result"] == "success" for job in results.values()))
          PY

  full-result:
    if: >-
      ${{ always() && (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) }}
    needs: [full-start, build, go-docker, it-ce, it-ee, ee-creds, notarantool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: >-
            ${{ github.repository == 'tarantool/tt' &&
            '["full-start","build","go-docker","it-ce","it-ee","ee-creds","notarantool"]' ||
            '["full-start","build","go-docker","it-ce","notarantool"]' }}
        run: python3 ci/status.py
