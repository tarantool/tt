name: Full CI

# full-ok joins the required checks on one source SHA. Forks run CE only,
# and fork-status.yml publishes full-ok from the result of their ce-result.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit selected by the nightly scheduler
        type: string
        required: true
    secrets:
      TT_EE_USERNAME:
        required: false
      TT_EE_PASSWORD:
        required: false
  push:
    branches: [v3, master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  # An unrelated label must not cancel a requested full run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'tests' }}
  cancel-in-progress: ${{ inputs.ref == '' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && (github.event_name != 'push' || (github.ref != 'refs/heads/v3' && github.ref != 'refs/heads/master')) }}

env:
  GO_VERSION: '1.27.4'
  PYTHON_VERSION: '3.12'

jobs:
  snapshot:
    if: >-
      ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci')) }}
    uses: ./.github/workflows/_packages.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

  full-start:
    if: >-
      ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
        run: python3 ci/status.py

  go-docker:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-snapshot-default-linux-amd64

      - name: Prepare binary
        run: chmod +x tt

      - name: Prepare CE environment
        uses: ./.github/actions/prepare-ce-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: latest
          build-tt: 'false'

      - name: Set up the toolchains of the build backends
        uses: ./.github/actions/setup-build-toolchains # zizmor: ignore[self-repository] -- Test the checked-out revision.

      # The events of the tests are what the check of the skips reads.
      - name: Go tests including Docker integration
        env:
          TT_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: mage unit:full

      - name: Check that no build backend test skipped for a missing tool
        env:
          TT_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: ci/build-backend-skips.sh

  # The Go tests on Linux arm64: the build backends link and load modules of
  # the machine they run on, which go-docker and go-macos do not cover.
  go-arm64:
    needs: snapshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-snapshot-default-linux-arm64

      - name: Prepare binary
        run: chmod +x tt

      - name: Prepare CE environment
        uses: ./.github/actions/prepare-ce-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: latest
          build-tt: 'false'

      - name: Set up the toolchains of the build backends
        uses: ./.github/actions/setup-build-toolchains # zizmor: ignore[self-repository] -- Test the checked-out revision.

      # go-docker runs the Docker tests on amd64. The events of the tests are
      # what the check of the skips reads.
      - name: Go tests with integration, excluding Docker
        env:
          TT_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: mage unit:fullSkipDocker

      - name: Check that no build backend test skipped for a missing tool
        env:
          TT_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: ci/build-backend-skips.sh

  it-ce:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [min, latest]
        shard: [cluster, replicaset, instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool and not tarantool_master
      full: true
      # The instances group has the coredump tests, the only ones that read
      # it: this is their run on the gdb 15 of ubuntu-24.04 (see coredump).
      require-debug-info: true

  arm64:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        # Without the slow tests the cluster group takes under a minute, so
        # it goes with replicaset.
        shard: ['cluster, replicaset', instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      runner: ubuntu-24.04-arm
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-arm64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: latest
      shard: ${{ matrix.shard }}
      marker: not slow and not slow_ee and not notarantool and not tarantool_master

  # The coredump tests on the gdb of the other Ubuntu runners, 12 of 22.04
  # and 17 of 26.04, and on arm64: the gdb extensions of tarantool-gdb-tools
  # tt vendors on a core of the oldest and the newest Tarantool CI tests
  # (test/integration/coredump/test_gdb_tools.py). it-ce runs them on gdb 15
  # of ubuntu-24.04, in the instances group. The static deb of Tarantool CE
  # has the debugging information they need, and a test fails rather than
  # skips without it. One cell checks the vendored copies against GitHub,
  # which is the same for all.
  coredump:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-26.04, ubuntu-24.04-arm]
        tarantool-version: [min, latest]
        include:
          - runner: ubuntu-26.04
            tarantool-version: latest
            gdb-tools-upstream: true
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      runner: ${{ matrix.runner }}
      tt-source: snapshot
      tt-artifact: ${{ endsWith(matrix.runner, '-arm') && 'tt-snapshot-default-linux-arm64' || 'tt-snapshot-default-linux-amd64' }}
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: ${{ matrix.tarantool-version }}
      # The shard sets up nothing more: test-dir selects the tests, which
      # fetch no rock.
      shard: instances
      test-dir: coredump
      marker: not slow_ee and not notarantool and not tarantool_master
      full: true
      require-debug-info: true
      gdb-tools-upstream: ${{ matrix.gdb-tools-upstream || false }}
      rocks-mirror: false

  macos:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        shard: ['cluster, replicaset', instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      runner: macos-15
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-darwin-arm64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: latest
      shard: ${{ matrix.shard }}
      marker: not slow and not slow_ee and not notarantool and not tarantool_master and not docker
      # Allow time for tt binary install to build Tarantool from source.
      timeout-minutes: 90
      continue-on-error: true

  it-ee:
    needs: snapshot
    if: >-
      ${{ github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: [min, latest]
        shard: [cluster, replicaset, instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool and not tarantool_master
      full: true
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  ee-creds:
    needs: snapshot
    if: >-
      ${{ github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: latest
      marker: ''
      test-dir: ee
      ee-credentials: true
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  tls-openssl:
    needs: snapshot
    if: >-
      ${{ github.repository == 'tarantool/tt' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-openssl_static-linux-amd64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: latest
      marker: tls
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  notarantool:
    needs: snapshot
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      edition: none
      tarantool-version: ''
      marker: notarantool

  # fork-status.yml publishes full-ok from the result of this job.
  ce-result:
    if: >-
      ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    # macos is informational until the platform tests are stable.
    needs: [snapshot, go-docker, go-arm64, it-ce, arm64, coredump, notarantool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the unprivileged jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(not all(job["result"] == "success" for job in results.values()))
          PY

  full-result:
    if: >-
      ${{ always() && (inputs.ref != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) }}
    # macos is informational until the platform tests are stable.
    needs: [full-start, snapshot, go-docker, go-arm64, it-ce, arm64, coredump, it-ee, ee-creds, tls-openssl, notarantool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: >-
            ${{ github.repository == 'tarantool/tt' &&
            '["full-start","snapshot","go-docker","go-arm64","it-ce","arm64","coredump","it-ee","ee-creds","tls-openssl","notarantool"]' ||
            '["full-start","snapshot","go-docker","go-arm64","it-ce","arm64","coredump","notarantool"]' }}
        run: python3 ci/status.py
