name: Full CI

# full-ok joins CE and EE, including approved fork checks, on one source SHA.
on:
  push:
    branches: [v3, master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  # EE secrets are gated by ee-fork; fork code gets a read-only token and no cache.
  # Status jobs load only the trusted workflow revision, never PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  # An unrelated label must not cancel a requested full run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'tests' }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/v3' && github.ref != 'refs/heads/master') }}

env:
  GO_VERSION: '1.27.3'
  PYTHON_VERSION: '3.12'

jobs:
  snapshot:
    if: >-
      ${{ github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'full-ci')) }}
    uses: ./.github/workflows/_packages.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  full-start:
    if: >-
      ${{ github.event_name == 'push' ||
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
        run: python3 ci/status.py

  build-ee-fork:
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    needs: full-start
    uses: ./.github/workflows/_packages.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      environment: ee-fork
      cache: false

  go-docker:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-snapshot-default-linux-amd64

      - name: Prepare binary
        run: chmod +x tt

      - name: Prepare CE environment
        uses: ./.github/actions/prepare-ce-test-env # zizmor: ignore[self-repository] -- Test the checked-out revision.
        with:
          tarantool-version: '3.9'
          build-tt: 'false'

      - name: Go tests including Docker integration
        run: mage unit:full

  it-ce:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        tarantool-version: ['3.3', '3.9']
        shard: [cluster, instances, tooling]
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool
      full: true

  arm64:
    needs: snapshot
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      runner: ubuntu-24.04-arm
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-arm64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: '3.9'
      marker: not slow and not slow_ee and not notarantool

  macos:
    needs: snapshot
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      runner: macos-15
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-darwin-arm64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ce
      tarantool-version: '3.9'
      marker: not slow and not slow_ee and not notarantool and not docker
      # Allow time for tt binary install to build Tarantool from source.
      timeout-minutes: 90
      continue-on-error: true

  it-ee:
    needs: [snapshot, build-ee-fork]
    if: |
      !cancelled() &&
      ((needs.snapshot.result == 'success' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) ||
       needs.build-ee-fork.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        shard: [cluster, instances, tooling]
        tarantool-version: ['3.3', '3']
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: ${{ matrix.tarantool-version }}
      shard: ${{ matrix.shard }}
      marker: not slow_ee and not notarantool
      full: true
      environment: ${{ github.event_name == 'pull_request_target' && 'ee-fork' || '' }}
      cache: ${{ github.event_name != 'pull_request_target' }}
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  ee-creds:
    needs: [snapshot, build-ee-fork]
    if: |
      !cancelled() &&
      ((needs.snapshot.result == 'success' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) ||
       needs.build-ee-fork.result == 'success')
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: '3'
      marker: ''
      test-dir: ee
      ee-credentials: true
      environment: ${{ github.event_name == 'pull_request_target' && 'ee-fork' || '' }}
      cache: ${{ github.event_name != 'pull_request_target' }}
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  tls-openssl:
    needs: [snapshot, build-ee-fork]
    if: |
      !cancelled() &&
      ((needs.snapshot.result == 'success' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) ||
       needs.build-ee-fork.result == 'success')
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-openssl_static-linux-amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ee
      tarantool-version: '3'
      marker: tls
      environment: ${{ github.event_name == 'pull_request_target' && 'ee-fork' || '' }}
      cache: ${{ github.event_name != 'pull_request_target' }}
    secrets:
      TT_EE_USERNAME: ${{ secrets.TT_EE_USERNAME }}
      TT_EE_PASSWORD: ${{ secrets.TT_EE_PASSWORD }}

  notarantool:
    needs: snapshot
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] -- Use the workflow revision selected by GitHub.
    with:
      tt-source: snapshot
      tt-artifact: tt-snapshot-default-linux-amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: none
      tarantool-version: ''
      marker: notarantool

  ce-result:
    if: >-
      ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    # macos is informational until the platform tests are stable.
    needs: [snapshot, go-docker, it-ce, arm64, notarantool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the unprivileged jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(not all(job["result"] == "success" for job in results.values()))
          PY

  wait-ce:
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      needs.full-start.result == 'success' && needs.it-ee.result == 'success' && needs.ee-creds.result == 'success' && needs.tls-openssl.result == 'success' }}
    needs: [full-start, it-ee, ee-creds, tls-openssl]
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Wait for the CE run on the same PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/status.py --wait-ce 7200

  full-result:
    if: >-
      ${{ always() && (github.event_name == 'push' ||
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) }}
    # macos is informational until the platform tests are stable.
    needs: [full-start, snapshot, go-docker, it-ce, arm64, it-ee, ee-creds, tls-openssl, notarantool, build-ee-fork, wait-ce]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ${{ github.workflow }}-status-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      # Load only the status helper from the trusted workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci/status.py
          sparse-checkout-cone-mode: false
      - name: Publish the aggregate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: full-ok
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: >-
            ${{ github.event_name == 'pull_request_target' &&
            '["full-start","build-ee-fork","it-ee","ee-creds","tls-openssl","wait-ce"]' ||
            '["full-start","snapshot","go-docker","it-ce","arm64","it-ee","ee-creds","tls-openssl","notarantool"]' }}
        run: python3 ci/status.py
