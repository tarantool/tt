[tool.codespell]
skip = 'go.sum, **/go.sum, **/third_party, tarantool-*, mage, **/zones_gen.go'
# Keep API names, GOST, WIT (the WebAssembly interface language), the crash-test
# fixture, the accepted spelling "unparseable" and the time zone abbreviations
# ECT and IST. zones_gen.go is the list of abbreviations of Tarantool.
ignore-words-list = ["atleast", "crasher", "ect", "fo", "gost", "ist", "unparseable", "wit"]
count = false
quiet-level = 3

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/ for a complete list of rules.
select = ["ARG", "COM", "E", "F", "I", "Q", "PERF", "RET", "RUF", "W"]
# To avoid RUF001 error add required unicode characters to the `allowed-confusables` list.
allowed-confusables = ["•", "⨯"]

[tool.ruff.lint.isort]
known-local-folder = ["utils"]
