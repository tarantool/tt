before:
  hooks:
    - go mod download

env:
  - GO111MODULE=on

builds:
  -
    id: tt
    binary: tt
    dir: cli

    env:
      - CGO_ENABLED=1

    tags:
      - netgo
      - osusergo

    ldflags:
      - -s -w
      - -X github.com/tarantool/tt/v3/cli/version.gitTag={{ .Tag }}
      - -X github.com/tarantool/tt/v3/cli/version.gitCommit={{ .ShortCommit }}

    goos:
      - darwin
    goarch:
      - amd64

archives:
  -
    id: "tt"
    builds: ['tt']
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

snapshot:
  name_template: "{{ .Tag }}-{{ .ShortCommit }}"
