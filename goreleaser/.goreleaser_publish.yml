version: 2
project_name: tt
dist: dist/publish
builds:
  - skip: true
changelog:
  disable: true
checksum:
  disable: true
release:
  draft: true
  mode: append
  # A tag with a pre-release suffix (v3.0.0-alpha.1, -rc1) marks the release
  # as not ready for production.
  prerelease: auto
  extra_files:
    - glob: dist/release/*
  header: |
    # Overview
