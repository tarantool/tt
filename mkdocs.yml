# The documentation of tt, published as a preview at
# https://tarantool.github.io/tt/. The pages are drafts for the technical
# writers: plain Markdown with few extensions, so that they can move to
# another toolchain. Build with mage docs:build, preview with mage docs:serve.
#
# The pages of reference/commands/ are generated from the help of tt
# (mage docs:reference) and are not in git. A command added to tt needs its
# page added to the nav below: the build fails on a page the nav omits.

site_name: Tarantool CLI
site_description: tt, the command-line utility for Tarantool applications
site_url: https://tarantool.github.io/tt/
repo_url: https://github.com/tarantool/tt
repo_name: tarantool/tt
edit_uri: edit/v3/doc/

docs_dir: doc
exclude_docs: |
  overrides/
  examples.md
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - What's new in tt 3: whats-new.md
  - Get started:
      - get-started/install.md
      - get-started/first-cluster.md
      - get-started/first-package.md
  - Write your application:
      - write-your-app/http-api-in-wasm.md
  - Concepts:
      - concepts/projects-and-scopes.md
      - concepts/packages.md
      - concepts/instances.md
      - concepts/rock-servers.md
      - concepts/distributions.md
  - How-to:
      - how-to/binaries.md
      - how-to/user-scope.md
      - how-to/systemd.md
      - how-to/script-instances.md
      - how-to/external-processes.md
      - how-to/sign-packages.md
      - how-to/external-modules.md
      - how-to/rust-modules.md
      - how-to/write-a-module.md
      - how-to/build-distribution.md
      - how-to/wasm-components.md
      - Migrate from tt 2.x: migration_from_older_versions.md
  - Reference:
      - Commands:
          - reference/commands/index.md
          - tt aeon: reference/commands/aeon.md
          - tt backup: reference/commands/backup.md
          - tt binary: reference/commands/binary.md
          - tt cluster: reference/commands/cluster.md
          - tt completion: reference/commands/completion.md
          - tt connect: reference/commands/connect.md
          - tt coredump: reference/commands/coredump.md
          - tt create: reference/commands/create.md
          - tt daemon: reference/commands/daemon.md
          - tt data: reference/commands/data.md
          - tt instance: reference/commands/instance.md
          - tt modules: reference/commands/modules.md
          - tt new: reference/commands/new.md
          - tt package: reference/commands/package.md
          - tt registry: reference/commands/registry.md
          - tt replicaset: reference/commands/replicaset.md
          - tt restore: reference/commands/restore.md
          - tt rocks: reference/commands/rocks.md
          - tt run: reference/commands/run.md
          - tt service: reference/commands/service.md
          - tt tcm: reference/commands/tcm.md
          - tt test: reference/commands/test.md
          - tt version: reference/commands/version.md
          - tt wasm: reference/commands/wasm.md
          - Exit codes: reference/commands/errors.md
      - reference/app-manifest.md
      - reference/tt-manifest.md
      - reference/instances-yaml.md
      - reference/templates.md
      - reference/environment.md
      - reference/layout.md
  - Project:
      - known_issues.md
      - contributing.md

theme:
  name: material
  custom_dir: doc/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - toc.follow

extra:
  generator: false

plugins:
  - search
  # Russian next to English: page.ru.md translates page.md and is served
  # under /ru/; a page with no translation falls back to the English one,
  # as the generated command reference always does. Material gets the
  # language switcher and search gets both languages. Translations that lag
  # behind their English pages: mage docs:stale.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: ru
          name: Русский
          site_description: tt, утилита командной строки для приложений Tarantool
          # The titles the nav sets explicitly; the others come from the
          # first heading of a page.
          nav_translations:
            Home: Главная
            What's new in tt 3: Что нового в tt 3
            Get started: Начало работы
            Concepts: Концепции
            Write your application: Пишем приложение
            How-to: Руководства
            Migrate from tt 2.x: Переход с tt 2.x
            Reference: Справочник
            Commands: Команды
            Exit codes: Коды завершения
            Project: О проекте

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
      # GitHub's anchors, so that a link works both on GitHub and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
